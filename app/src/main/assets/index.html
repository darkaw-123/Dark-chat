<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040b">
<title>DARK CHAT</title>



<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05040b;--bg2:#03040a;--pn:#0b0a14;--pn2:#141121;--bd:#28213a;--p1:#8b5cf6;--p2:#5b21b6;--p3:#c4b5fd;--tx:#f3f5fb;--mu:#a6a0b8;--ok:#32d296;--in:#141121;--out:#5b21b6;--chat:#05040b;--vh:100dvh;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg2);color:var(--tx);font:15px/1.4 Sora,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.grad{background:linear-gradient(135deg,var(--p1),var(--p2))}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 24px #8b5cf655;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:default}
.btn.g{background:var(--pn2);box-shadow:none;border:1px solid var(--bd)}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:#ffffff0d;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.ib:hover{background:#8b5cf633}.ib[disabled]{opacity:.35;cursor:not-allowed}
input,textarea{width:100%;background:var(--pn2);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;outline:0}
input:focus,textarea:focus{border-color:var(--p1);box-shadow:0 0 0 3px #8b5cf630}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 6px}
#auth,#boot{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#5b21b655,transparent),var(--bg)}
.card{width:min(420px,100%);background:var(--pn);border:1px solid var(--bd);border-radius:24px;padding:26px;box-shadow:0 0 60px #8b5cf622;max-height:90dvh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
.logo svg{width:34px;height:34px}
.err{color:#ff8da1;min-height:20px;font-size:13px;margin-top:10px}
#app{height:var(--vh);display:grid;grid-template-columns:380px 1fr}
#side{display:flex;flex-direction:column;min-height:0;background:var(--pn);border-right:1px solid var(--bd)}
#side header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) 14px 12px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#141121,var(--pn))}
#list{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain}
#nav{display:flex;border-top:1px solid var(--bd);padding:6px 6px calc(6px + var(--sab));background:#0b0a14dd;backdrop-filter:blur(14px)}
#nav button{flex:1;background:0;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:8px 0;border-radius:14px;cursor:pointer;position:relative}
#nav button.on{color:var(--p3);background:#8b5cf622;box-shadow:inset 0 0 0 1px #8b5cf655}
.dot{position:absolute;top:4px;right:calc(50% - 18px);background:var(--p1);color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:0 4px;text-align:center}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid #28213a55}
.row:hover,.row.on{background:#8b5cf61a}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p2));overflow:hidden;background-size:cover;background-position:center}
.av.s{width:36px;height:36px;font-size:13px}.av.l{width:96px;height:96px;font-size:34px}
.rt{flex:1;min-width:0}.rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{color:var(--mu);font-size:11px;text-align:right}
.empty{padding:44px 26px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);margin-bottom:6px}
.sts{display:flex;gap:12px;overflow:auto;padding:12px 14px;border-bottom:1px solid var(--bd)}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mu);cursor:pointer;width:58px;flex:none}
.st .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--p1)}.st.me .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bd)}
.ann{margin:12px 14px;padding:16px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(135deg,#8b5cf622,#141121 60%)}
.ann h4{margin:0 0 6px}.ann p{margin:0;color:#d9d4ea;white-space:pre-wrap;word-break:break-word}.ann small{color:var(--mu);display:block;margin-top:8px}
.ann img{max-width:100%;border-radius:12px;margin-top:10px}
#chat{display:flex;flex-direction:column;min-height:0;background:radial-gradient(700px 400px at 80% 0,#5b21b633,transparent),var(--chat)}
#chat .hd{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 12px 10px;border-bottom:1px solid var(--bd);background:#0b0a14ee}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:18px;word-break:break-word;white-space:pre-wrap}
.m.i{align-self:flex-start;background:var(--in);border:1px solid var(--bd);border-bottom-left-radius:6px}
.m.o{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--out));border-bottom-right-radius:6px;box-shadow:0 4px 18px #5b21b655}
.m .msgtools{display:flex;gap:7px;margin-top:5px;justify-content:flex-end}.m .msgtools button{border:0;border-radius:8px;background:#ffffff20;color:inherit;padding:3px 7px;font-size:11px;cursor:pointer}.m small{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:2px}.m .nm{font-size:12px;color:var(--p3);font-weight:600}
.m audio{height:36px;max-width:230px}.m.x{opacity:.6;font-style:italic}
.cmp{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--bd);background:#0b0a14ee}
.cmp input{border-radius:24px}.rec{background:#e11d48!important;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #e11d4833}}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50}
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(420px,92vw)}
#toast div{padding:12px 14px;border-radius:14px;background:var(--pn2);border:1px solid var(--p1);box-shadow:0 8px 30px #000a}
#toast div.e{border-color:#ff8da1}
#callUI{position:fixed;inset:0;z-index:70;background:radial-gradient(800px 500px at 50% 0,#5b21b6aa,transparent),var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#callUI video#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#callUI video#lv{position:absolute;right:14px;top:calc(14px + var(--sat));width:110px;border-radius:14px;border:2px solid var(--p1);background:#000;z-index:2}
#callUI .ctl{position:absolute;bottom:calc(30px + var(--sab));display:flex;gap:18px;z-index:2}
#callUI .ctl .ib{width:64px;height:64px}
#callUI .inf{position:relative;z-index:2;text-shadow:0 2px 12px #000}
.back{display:none}
.m a{color:var(--p3);text-decoration:underline;word-break:break-all}.m.o a{color:#fff}
.m a.lk{display:block;margin-top:6px;padding:8px 10px;border-radius:12px;background:#0007;border-left:3px solid var(--p3);text-decoration:none}
.lk b{display:block;color:#fff;font-size:13px}.lk span{display:block;color:#d9d4ea;font-size:11px;word-break:break-all;opacity:.85}
.m img.at,.m video.at{max-width:100%;max-height:300px;border-radius:12px;display:block;cursor:pointer;margin-bottom:4px}
.m a.fc{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}.fc .av{border-radius:12px;width:40px;height:40px}.fc b{font-size:13px;word-break:break-all;display:block}
@media(max-width:899px){
#app{grid-template-columns:1fr}
#chat{position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .22s}
#chat.open{transform:none}.back{display:grid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Dark Chat v1.5.1 · Premium Store activation flow */
#dc-store-root{padding:13px 12px 26px;overflow-x:hidden}
#dc-store-root .dcsflow{display:grid;gap:15px;padding-bottom:14px}
#dc-store-root .dcspayhero{background:radial-gradient(ellipse at 80% 0%,rgba(168,85,247,.35),transparent 55%),linear-gradient(135deg,#1c112b,#100b1f 82%);border:1px solid #513775;border-radius:23px; padding:23px 18px 22px;box-shadow:0 12px 32px #05020b70;text-align:center}
#dc-store-root .dcspill{font-size:10px;letter-spacing:1.4px;font-weight:800;color:#d9c2ff}
#dc-store-root .dcspayemblem{font-size:40px;margin:12px auto 6px;filter:drop-shadow(0 6px 14px #8a31ff77)}
#dc-store-root .dcspayhero h2{font-size:22px;letter-spacing:-.6px;color:#fff;margin:8px 0}
#dc-store-root .dcspayhero p{font-size:12px;line-height:1.6;color:#bdb0d4;margin:0 auto 17px;max-width:350px}
#dc-store-root .dcstotal{background:#ffffff0a;border:1px solid #ffffff19;border-radius:18px;display:grid;gap:3px;padding:17px}
#dc-store-root .dcstotal small{color:#c2b3d7;font-size:11px}
#dc-store-root .dcstotal strong{color:#fff;font-size:33px;letter-spacing:-1px;font-weight:850}
#dc-store-root .dcstotal span{color:#cdb8eb;font-size:11px}
#dc-store-root .dcsc{border:1px solid #433056;background:linear-gradient(160deg,#171021,#100d17);border-radius:19px;padding:17px 15px;box-shadow:0 5px 20px #0003;display:grid;gap:12px;min-width:0}
#dc-store-root .dcsc h3{font-size:17px;margin:0;color:#faf6ff}
#dc-store-root .dcsc h4{font-size:14px;margin:0}
#dc-store-root .dcsc p{line-height:1.55;overflow-wrap:anywhere;margin:2px 0;color:#c2b8d2;font-size:12px}
#dc-store-root .dcssteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px 0}
#dc-store-root .dcssteps>div{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
#dc-store-root .dcssteps span{height:34px;width:34px;border:1px solid #6c4e91;border-radius:50%;background:#41265e;display:grid;place-items:center;color:#f5e6ff;font-size:11px;font-weight:750}
#dc-store-root .dcssteps b{font-size:10px}
#dc-store-root .dcssteps small{font-size:9px;line-height:1.3;color:#9c90ad}
#dc-store-root .dcspaytitle{display:flex;align-items:center;gap:11px}
#dc-store-root .dcspaytitle>span{background:#553182;padding:12px;border-radius:15px;font-size:22px}
#dc-store-root .dcspaytitle h3{font-size:15px}
#dc-store-root .dcspay{padding:15px;border:1px solid #75519f;border-radius:17px;background:linear-gradient(125deg,#3a205a,#201533);display:grid;gap:11px}
#dc-store-root .dcspaytop,#dc-store-root .dcspayline{display:flex;align-items:center;justify-content:space-between;gap:10px}
#dc-store-root .dcspaytop{border-bottom:1px solid #ffffff20;padding-bottom:11px;font-size:13px}
#dc-store-root .dcspayline{font-size:12px}
#dc-store-root .dcspayline>span{color:#d2bfe8}
#dc-store-root .dcspayline strong{font-size:14px;overflow-wrap:anywhere;text-align:right}
#dc-store-root .dcsc form{display:grid;gap:7px;min-width:0}
#dc-store-root .dcsc label{font-size:12px;color:#e6dff0;font-weight:650;margin-top:8px}
#dc-store-root .dcsc input:not([type=checkbox]):not([type=file]),#dc-store-root .dcsc textarea,#dc-store-root .dcsc select{min-width:0;width:100%;color:#f9f7fc;background:#0b0914;border:1px solid #544068;border-radius:11px;padding:11px;outline:none}
#dc-store-root .dcsc input:focus,#dc-store-root .dcsc textarea:focus,#dc-store-root .dcsc select:focus{border-color:#b58bfa;box-shadow:0 0 0 2px #b58bfa21}
#dc-store-root .dcsc .btn,#dc-store-root .dcstabs .btn{border-radius:11px;min-height:36px}
#dc-store-root .dcsdim{font-size:11px!important;color:#aa9dbb!important}
#dc-store-root .dcsnotice{background:#35264a7a;padding:12px;border-radius:13px;font-size:11px;color:#dacced;line-height:1.55}
#dc-store-root .dcstabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#dc-store-root .dcstabs button{flex:1;font-size:11px;padding:8px 6px}
#dc-store-root .dcsafter{display:grid;gap:8px}
#dc-store-root .dcsstatus{text-align:center;border-radius:15px;padding:11px;background:#302047;border:1px solid #8565a4}
#dc-store-root .dcsstatusicon{font-size:32px;display:block}
#dc-store-root .dcswaiting{background:#2d2543}
#dc-store-root .dcsrejected{background:#49252c;border-color:#9a5464}
#dc-store-root .dcsreceipt{display:grid;gap:8px;border-top:1px solid #fff2;border-bottom:1px solid #fff2;padding:12px 0}
#dc-store-root .dcsreceipt>div{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px}
#dc-store-root .dcsreceipt span{color:#b5a9c9}#dc-store-root .dcsreceipt strong{overflow-wrap:anywhere;text-align:right}
#dc-store-root .dcsstores,#dc-store-root .dcsgrid,#dc-store-root .dcslist{display:grid;gap:9px}
#dc-store-root .dcsstore{background:#241a35;border:1px solid #55416d;border-radius:12px;color:#fff;padding:13px;text-align:left;display:grid;gap:3px}
#dc-store-root .dcsstore small{color:#b6a6ca}
#dc-store-root .dcsproduct{padding:11px;border:1px solid #514069;border-radius:14px;background:#1e152f;display:grid;gap:6px;min-width:0}
#dc-store-root .dcsprice{font-size:19px;font-weight:750;color:#e6c5ff}
#dc-store-root .dcspic{height:125px;width:100%;object-fit:cover;border-radius:12px}
#dc-store-root .dcsempty{font-size:40px;display:grid;place-items:center;min-height:105px}
#dc-store-root .dcsactions{display:flex;gap:7px;flex-wrap:wrap}
#dc-store-root .dcsactions button{flex:1}
#dc-store-root .dcsorder{padding:12px;background:#1f1630;border:1px solid #3c2b55;border-radius:12px;display:grid;gap:7px;font-size:12px}
@media (min-width:450px){#dc-store-root .dcsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Dark Chat marketplace: restrained, responsive seller interface */
#dc-store-root{--dcs-line:#322941;--dcs-quiet:#a69ab8;--dcs-paper:#151120;--dcs-accent:#bfa4ff;padding:14px 12px 38px;max-width:100%;color:#f4f0fa}
#dc-store-root .dcsflow,#dc-store-root .dcs-seller-content{display:grid;gap:14px;min-width:0}
#dc-store-root .dcstabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:0 0 14px;padding:5px;border:1px solid #30253f;border-radius:15px;background:#110d1b}
#dc-store-root .dcstabs .btn{min-width:0;min-height:40px!important;font-size:11px;font-weight:650;background:transparent;border:1px solid transparent;box-shadow:none;color:#aaa0b8;padding:9px 3px;border-radius:10px}
#dc-store-root .dcstabs .dcs-selected{background:#38244f;color:#f4e7ff;border-color:#594071}
#dc-store-root .dcsc{padding:17px;border-radius:17px;background:linear-gradient(155deg,#171320,#100d19);border:1px solid var(--dcs-line);box-shadow:0 12px 26px #0002;gap:13px}
#dc-store-root .dcsc h3{margin:0;font-weight:700;font-size:17px;letter-spacing:-.4px}
#dc-store-root .dcsc p{line-height:1.62;font-size:12px;margin:0;color:#b8aec6}
#dc-store-root .dcsdim{font-size:11px!important;line-height:1.55!important;color:var(--dcs-quiet)!important}
#dc-store-root .dcs-eyebrow{display:block;font-size:9px;font-weight:750;letter-spacing:1.7px;color:#cfb6ff}
#dc-store-root .dcs-section-intro{display:grid;gap:6px;margin:1px 0 9px}
#dc-store-root .dcs-section-intro h3{font-size:20px;letter-spacing:-.5px}
#dc-store-root .dcs-home{background:linear-gradient(150deg,#2b1b42 0%,#171020 75%);border:1px solid #674c84;border-radius:20px;padding:20px 18px;box-shadow:0 14px 35px #0003}
#dc-store-root .dcs-home-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
#dc-store-root .dcs-home h2{font-size:20px;margin:6px 0 7px;letter-spacing:-.6px;line-height:1.25;overflow-wrap:anywhere}
#dc-store-root .dcs-home p{margin:0;color:#c3b8d2;font-size:11px;line-height:1.55;max-width:330px}
#dc-store-root .dcs-live{font-size:10px;background:#1c503d55;color:#9af1c4;border:1px solid #3c8767;border-radius:99px;padding:4px 9px;flex:none}
#dc-store-root .dcsmetrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
#dc-store-root .dcsmetrics>div{display:grid;gap:3px;border:1px solid #ffffff19;border-radius:12px;background:#ffffff09;padding:12px 7px;text-align:center}
#dc-store-root .dcsmetrics strong{font-size:20px;font-weight:750;color:#fff;line-height:1.3}
#dc-store-root .dcsmetrics span{font-size:10px;color:#bdafd1}
#dc-store-root .dcs-manage{background:#15111e;border:1px solid #332a42;border-radius:16px;overflow:hidden;min-width:0}
#dc-store-root .dcs-manage[open]{border-color:#584375}
#dc-store-root .dcs-manage summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 15px;min-height:71px}
#dc-store-root .dcs-manage summary::-webkit-details-marker{display:none}
#dc-store-root .dcs-manage-title{display:grid;gap:4px;min-width:0}
#dc-store-root .dcs-manage-title b{font-size:14px;font-weight:700}
#dc-store-root .dcs-manage-title small{font-size:10px;line-height:1.5;color:#a9a0b7}
#dc-store-root .dcs-manage-tail{flex:none;color:#d9c6f8;background:#392a4e;border:1px solid #554069;padding:5px 9px;border-radius:8px;font-size:10px}
#dc-store-root .dcs-manage-tail:after{content:'⌄';margin-left:6px}
#dc-store-root .dcs-manage[open] .dcs-manage-tail:after{content:'⌃'}
#dc-store-root .dcs-manage-body{border-top:1px solid #30263e;padding:15px;display:grid;gap:16px}
#dc-store-root .dcs-manage-body form{display:grid;gap:8px;min-width:0}
#dc-store-root .dcs-manage-body label{font-size:11px;color:#c8bfd2;font-weight:600;margin:4px 0 0}
#dc-store-root .dcs-manage-body input:not([type=checkbox]):not([type=file]),#dc-store-root .dcs-manage-body select,#dc-store-root .dcs-manage-body textarea{background:#100d17;border:1px solid #433751;border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:12px}
#dc-store-root .dcs-manage-body input[type=file]{width:100%;max-width:100%;font-size:11px;padding:9px;border:1px dashed #58416d;background:#100c18;border-radius:10px}
#dc-store-root .dcs-manage-body .btn{justify-self:start;box-shadow:none;border-radius:10px;margin-top:5px;font-size:12px;padding:10px 16px}
#dc-store-root .dcs-manage-body .dcs-check{display:flex;align-items:center;gap:9px;line-height:1.45}
#dc-store-root .dcs-check input{width:16px;height:16px;flex:none}
#dc-store-root .dcslist{display:grid;gap:8px}
#dc-store-root .dcs-manage-row{display:flex;align-items:center;justify-content:space-between;gap:11px;background:#211928;border:1px solid #3a3048;border-radius:11px;padding:10px}
#dc-store-root .dcs-row-name{display:grid;gap:3px;overflow-wrap:anywhere;min-width:0;font-size:12px}
#dc-store-root .dcs-row-name small{display:block;color:#ad9fc0;font-size:10px}
#dc-store-root .btn.r{background:#5b2536;border:1px solid #8e4155;color:#ffd7df;box-shadow:none}

/* V9.1 · Fixed bottom navigation sizing in Android WebView. */
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}

#side{min-width:0;min-height:0;overflow:hidden}
#list{flex:1 1 0;min-height:0;min-width:0;overflow-x:hidden}
#nav{
  box-sizing:border-box;flex:0 0 calc(58px + var(--sab));
  height:calc(58px + var(--sab));min-height:calc(58px + var(--sab));max-height:calc(58px + var(--sab));
  width:100%;max-width:100%;overflow:hidden;
  align-items:stretch;gap:0;padding:4px 3px calc(4px + var(--sab));
}
#nav>button{
  box-sizing:border-box;flex:1 1 0;width:0;min-width:0;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px!important;padding:3px 1px!important;margin:0!important;
  font-size:10px!important;line-height:1.15!important;font-weight:600;
  white-space:nowrap;word-break:normal;overflow:hidden;
}
#nav>button>svg.i{
  display:block!important;flex:0 0 20px!important;
  width:20px!important;height:20px!important;
  min-width:20px!important;min-height:20px!important;
  max-width:20px!important;max-height:20px!important;
}

.dcg-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(14px,4vw,30px);background:#140d20;border-bottom:1px solid #372951;gap:12px}
.dcg-head strong{display:block;font-size:16px}.dcg-head small{display:block;font-size:11px;color:#c1b1d5}
#dc-guest-shop button{cursor:pointer}
.dcg-small{background:#221736;color:#ddd1f3;border:1px solid #514073;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600}
#dcg-content{width:min(720px,100%);padding:18px 14px 50px;margin:0 auto}
.dcg-card{border:1px solid #493266;border-radius:18px;background:#160f25;padding:17px;margin:0 0 16px;box-shadow:0 6px 22px #0005}
.dcg-card h2,.dcg-card h3{margin:5px 0 10px}.dcg-card p{color:#c8b9db;font-size:13px;line-height:1.65}
.dcg-cta{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:#a889f4;color:#140b24;font-size:13px;min-height:42px}
.dcg-cta:disabled{opacity:.55}
.dcg-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dcg-product{min-width:0;border:1px solid #493266;border-radius:14px;background:#1d1430;overflow:hidden}
.dcg-product img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#241733}
.dcg-product-info{padding:11px}.dcg-product-info b{display:block;overflow-wrap:anywhere;font-size:13px}.dcg-product-info small{display:block;color:#bea9d8;margin:6px 0}.dcg-product-info button{width:100%}
.dcg-label{display:block;color:#cdb9e9;font-size:12px;margin:15px 0 6px;font-weight:600}
.dcg-card input,.dcg-card select,.dcg-card textarea{display:block;width:100%;max-width:100%;border:1px solid #493266;border-radius:10px;background:#0d0918;color:#f2eaff;padding:12px;font-size:14px}
.dcg-card textarea{min-height:90px}.dcg-product button{font-size:12px}
.dcg-payment{white-space:pre-wrap;overflow-wrap:anywhere;padding:13px;border-radius:12px;background:#0c0816;color:#dccaf7;border:1px solid #4d3973;font-size:13px}
.dcg-feedback{margin:12px 0;color:#e8d9ff}.dcg-feedback.bad{color:#ff929e}
.dcg-pill{background:#2e1e49;color:#dcc8ff;border-radius:9px;padding:8px 11px;font-size:12px;display:inline-block;margin:8px 0}
@media(max-width:360px){.dcg-products{grid-template-columns:1fr}.dcg-card{padding:12px}}


/* 9.5: Search below status, private contact nicknames */
.dc-search-shell{padding:10px 14px 9px;border-bottom:1px solid var(--bd);background:var(--pn);display:grid;gap:8px}
.dc-search-toggle{display:flex;align-items:center;gap:9px;width:100%;padding:10px 13px;border:1px solid var(--bd);border-radius:13px;background:var(--pn2);color:var(--mu);font-weight:500;font-size:13px;text-align:left}
.dc-search-toggle svg{width:19px;height:19px}.dc-search-input{border:1px solid var(--p1)!important;border-radius:12px!important;background:var(--bg)!important;padding:11px 13px!important;margin:0!important;width:100%;outline-offset:2px}
.dc-search-empty{text-align:center;color:var(--mu);padding:28px 18px;font-size:13px}
.dc-contact-subtitle{font-size:11px;line-height:1.5;color:var(--mu);margin:5px 0 12px}
.dc-inline-nick{width:100%;border-radius:11px;padding:11px 12px;background:var(--pn2);color:var(--tx);border:1px solid var(--bd)}
/* V9.6 unsaved-contact management, two-way blocked DMs and calls */
.dc-contact-notice{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:9px;margin:9px 12px;padding:11px 12px;border:1px solid var(--bd);background:var(--pn2);border-radius:13px;color:var(--mu);font-size:12px}
.dc-contact-notice>div{display:flex;gap:8px;flex-wrap:wrap}
.dc-contact-notice .btn{padding:9px 10px;font-size:12px}
.dc-blocked-composer{border-top:1px solid var(--bd);padding:15px;background:var(--pn);color:var(--mu);text-align:center;font-size:12px}

.dc-avatar-picker{display:flex;gap:12px;align-items:center;margin:8px 0 16px;padding:12px;border:1px solid var(--bd);border-radius:14px}.dc-avatar-picker #dc-signup-avatar-preview{width:64px;height:64px;flex:none;background-size:cover;background-position:center;border:2px solid var(--p1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px}.dc-avatar-picker input[type=file]{width:100%;font-size:12px}.dc-avatar-picker small{font-size:11px;color:var(--mu);display:block;margin-top:7px}

/* V9.8 group invitation center and professional group profile picker */
.dc-group-picker{margin:13px 0}.dc-group-friends{max-height:250px;overflow-y:auto;margin:10px 0;padding:8px;border:1px solid var(--bd);border-radius:13px}
#dc-group-friends[hidden]{display:none!important}
.dc-group-friend{display:flex;align-items:center;gap:10px;padding:9px 7px;border-radius:10px;cursor:pointer}
.dc-group-friend+.dc-group-friend{border-top:1px solid var(--bd)}
.dc-group-friend input[type=checkbox]{flex:none;width:18px;height:18px;accent-color:#a78bfa}
.dc-group-friend .av{flex:none}.dc-group-friend span{flex:1;min-width:0}
.dc-group-friend b{font-size:13px;display:block;overflow-wrap:anywhere}
.dc-group-friend small{font-size:11px;color:var(--mu);display:block;line-height:1.4}
.dc-group-helper,.dc-group-empty{font-size:12px;color:var(--mu);line-height:1.5}
.dc-group-photo-picker{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);padding:12px;border-radius:13px;margin:9px 0 12px}
.dc-group-photo-preview{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background-color:var(--pn2);border:2px solid var(--p1);background-position:center;background-size:cover;font-size:26px}
.dc-group-photo-picker input[type=file]{width:100%;min-width:0;font-size:12px}
.dc-group-photo-picker small{color:var(--mu);font-size:11px}
.dc-invite-box{margin:11px 10px 19px;padding:14px 12px;background:var(--pn);border:1px solid var(--p1);border-radius:16px}
.dc-invite-box h3{font-size:15px;margin:0 0 10px}.dc-invite-box h3 span{color:var(--p3)}
.dc-invite-card{display:flex;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid var(--bd)}
.dc-invite-card>.av{flex:none}.dc-invite-body{flex:1;min-width:0}.dc-invite-body>b{display:block;font-size:13px}.dc-invite-body>small{display:block;color:var(--mu);font-size:11px;margin:4px 0 8px}
.dc-invite-body>div{display:flex;gap:8px}.dc-invite-body .btn{padding:8px 12px;font-size:12px}

async function toggleRec(){

  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(st,mt?{mimeType:mt}:{}),ch=[],cid=cur;
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);

   const type=(mr.mimeType||'audio/webm').split(';')[0],blob=new Blob(ch,{type});
   if(blob.size<1500)return toast('Recording was too short.',1);
   if(blob.size>10*1048576)return toast('Voice message is too large (10 MB max).',1);
   await sendAudio(cid,blob,type)};
  rec={mr};mr.start();$('#mic').classList.add('rec');toast('Recording… tap the mic again to send');
 }catch(e){toast(e.name==='NotAllowedError'?'Microphone permission is blocked.':'Could not start recording.',1)}

function subscribe(){

 db=sb.channel('dc-db')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async({new:m})=>{
   if(!conv(m.conversation_id)){await loadConvs();render();listenCalls();if(!conv(m.conversation_id))return}
   last[m.conversation_id]=m;
   if(m.conversation_id===cur)addMsg(m);
   if(m.sender_id!==me.id){const c=conv(m.conversation_id);if(m.conversation_id!==cur)unread[m.conversation_id]=(unread[m.conversation_id]||0)+1;
    if(m.conversation_id!==cur||document.hidden)notify(cname(c),(c.kind==='group'?(names[m.sender_id]?.display_name||'')+': ':'')+prev(m))}
   render()})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},({new:m})=>{if(!conv(m.conversation_id))return;last[m.conversation_id]=last[m.conversation_id]?.id===m.id?m:last[m.conversation_id];if(m.conversation_id===cur&&conv(cur))openConv(cur);else render()})
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'announcements'},({new:a})=>{if(!a.is_active)return;anns.unshift(a);notify('Announcement',a.title);if(tab==='news')render()})
 .on('postgres_changes',{event:'*',schema:'public',table:'statuses'},async()=>{await loadStatus();if(tab==='chats')render()})
 .on('postgres_changes',{event:'*',schema:'public',table:'app_theme_settings'},({new:t})=>{if(t&&t.theme)applyTheme(t.theme)})
 .subscribe(s=>{
   if(s==='SUBSCRIBED'){rtRetry=0;loadConvs().then(()=>{render();listenCalls()}).catch(()=>{});loadAnns().then(()=>{if(tab==='news')render()}).catch(()=>{});}
   if((s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')&&me&&db){const old=db;db=null;sb.removeChannel(old);setTimeout(()=>{if(me&&!db){subscribe();loadConvs().then(render).catch(()=>{})}},Math.min(15000,1500*++rtRetry))}
 });
}

 if(blockedUsers.has(other(conv(cid)).user_id)){if(id)dismissCallInvite(id);return false;}
 call={cid,kind:kind==='video'?'video':'voice',dir:'in',pending:[],ok:false,inviteId:id||null};

}
async function checkPendingCall(){
 if(!me||!booted||!sb||checkingCall)return;
 if(call&&(!pendingNativeCall||pendingNativeCall.action!=='answer'))return;
 checkingCall=true;
 const request=pendingNativeCall;
 try{
  let q=sb.from('call_invites').select('id,conversation_id,caller_id,recipient_id,kind,expires_at')
   .eq('recipient_id',me.id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(1);
  if(request?.id)q=q.eq('id',request.id);
  const {data,error}=await q;
  if(error){console.warn('Incoming call lookup:',error.message);return}
  const invite=data?.[0];
  if(!invite){if(request)pendingNativeCall=null;return}
  const c=conv(invite.conversation_id);
  if(!c||c.kind!=='direct'||other(c)?.user_id!==invite.caller_id)return;
  if(blockedUsers.has(invite.caller_id)){await dismissCallInvite(invite.id);return;}
  if(request?.action==='decline'){
   if(call&&call.cid===invite.conversation_id&&call.dir==='in')endCall('missed',true);
   else{sig(invite.conversation_id,{t:'decline'});await dismissCallInvite(invite.id)}
   pendingNativeCall=null;return;
  }
  if(!call)showIncomingCall(invite.conversation_id,invite.kind,invite.id);
  if(request?.action==='answer'&&call?.dir==='in'&&call.cid===invite.conversation_id){
   pendingNativeCall=null;setTimeout(()=>acceptCall(),350);
  }else if(request)pendingNativeCall=null;
 }catch(e){console.warn('FCM incoming call lookup:',e)}
 finally{checkingCall=false}
}

 const d=e.detail||{};
 pendingNativeCall={id:String(d.id||''),action:String(d.action||'open')};
 if(me&&booted)setTimeout(()=>checkPendingCall(),100)
});

async function iceServers(){try{const {data:{session}}=await sb.auth.getSession();const r=await fetch(U+'/functions/v1/darkchat-webrtc-ice',{headers:{Authorization:'Bearer '+session.access_token,apikey:K}});const j=await r.json();if(j.iceServers)return j.iceServers}catch(_){}return [{urls:'stun:stun.l.google.com:19302'}]}
async function listenCalls(){
 const {data:{session}}=await sb.auth.getSession();if(session)await sb.realtime.setAuth(session.access_token);
 convs.filter(c=>c.kind==='direct'&&!chans[c.id]).forEach(c=>{
  const ch=sb.channel('call:'+c.id,{config:{private:true,broadcast:{self:false}}});
  ch.on('broadcast',{event:'sig'},({payload})=>onSig(c.id,payload||{})).subscribe();chans[c.id]=ch});
}
const sig=(cid,p)=>{const ch=chans[cid];if(!ch||!me)return Promise.resolve('no-channel');return ch.send({type:'broadcast',event:'sig',payload:Object.assign({from:me.id},p)}).catch(e=>{console.warn('Call signal failed',e);return 'error'})};
function reliableCallEnd(cid,kind){if(!cid||!me)return;const payload={t:kind||'end',ended_at:Date.now()};sig(cid,payload);setTimeout(()=>{if(me)sig(cid,payload)},450);setTimeout(()=>{if(me)sig(cid,payload)},1200)};
function callUI(h,video){const u=$('#callUI');u.hidden=false;u.innerHTML=(video?'<video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>':'<audio id="rv" autoplay></audio>')+h}

function ringHtml(txt,btns){const p=peerOf(call.cid),name=contactAliases[p.user_id]||p.display_name||'Unknown';return '<div class="inf">'+avHtml(p.avatar_path,name,'l')+'<h2 style="margin:12px 0 0">'+esc(name)+'</h2><div id="cs" style="color:var(--p3)">'+esc(txt)+'</div></div><div class="ctl">'+btns+'</div>'}
const callState=t=>{const e=$('#cs');if(e)e.textContent=t};
async function media(kind){if(!navigator.mediaDevices)throw new Error('Calls need a secure (https) connection.');try{return await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'?{facingMode:'user'}:false})}catch(e){throw new Error(e.name==='NotAllowedError'?'Microphone/camera permission is blocked.':'Could not access the microphone or camera.')}}
async function startCall(kind){
 if(call)return toast('You are already in a call.',1);
 const c=conv(cur);if(!c||c.kind!=='direct')return toast('Only private chats can start calls.',1);
 const recipient=other(c)?.user_id;if(!recipient)return toast('No recipient for this call.',1);
 if(blockedUsers.has(recipient))return toast('Unblock this contact before calling.',1);
 call={cid:c.id,kind,dir:'out',pending:[],ok:false,inviteId:null};
 try{call.stream=await media(kind)}catch(e){call=null;return toast(e.message,1)}
 callUI(ringHtml('Calling…','<button class="ib" style="background:#e11d48" data-a="xcall">'+ic('end')+'</button>'),kind==='video');
 if(kind==='video')$('#lv').srcObject=call.stream;
 try{
  const {data,error}=await sb.from('call_invites').insert({
   conversation_id:c.id,caller_id:me.id,recipient_id:recipient,kind:kind,
   expires_at:new Date(Date.now()+40000).toISOString()
  }).select('id').single();
  if(error)throw error;
  if(call&&call.cid===c.id&&call.dir==='out'){call.inviteId=data.id;dispatchCallPush(data.id)}
  else{dismissCallInvite(data.id);return}
 }catch(e){console.warn('Call push registration:',e);toast('Call push unavailable; trying live call.',1)}
 if(!call||call.cid!==c.id)return;
 sig(c.id,{t:'invite',kind,call_invite_id:call.inviteId});
 call.timer=setTimeout(()=>{toast('No answer.',1);endCall('missed',true)},40000);
}
async function newPC(){
 const pc=new RTCPeerConnection({iceServers:await iceServers()});call.pc=pc;
 call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
 pc.ontrack=e=>{const r=$('#rv');if(r&&r.srcObject!==e.streams[0]){r.srcObject=e.streams[0];r.play&&r.play().catch(()=>{})}};
 pc.onicecandidate=e=>{if(e.candidate&&call)sig(call.cid,{t:'ice',c:e.candidate})};
 pc.onconnectionstatechange=()=>{if(!call)return;const s=pc.connectionState;
  if(s==='connected'){call.ok=true;callState('Connected')}
  else if(s==='disconnected')callState('Reconnecting…');
  else if(s==='failed'){toast('Call connection failed.',1);endCall('failed',true)}};
}
async function flush(){while(call&&call.pending.length)try{await call.pc.addIceCandidate(call.pending.shift())}catch(_){}}
async function onSig(cid,p){
 if(p.from===me.id)return;
 const c=conv(cid);if(c?.kind==='direct'&&blockedUsers.has(other(c).user_id))return;
 if(p.t==='invite'){
  if(p.ended_at)return;
  if(call){
   if(call.dir==='in'&&call.cid===cid)return;
   sig(cid,{t:'decline',busy:1});return;
  }
  showIncomingCall(cid,p.kind,p.call_invite_id);return;
 }
 if(!call||call.cid!==cid)return;
 if(p.t==='accept'&&call.dir==='out'){clearTimeout(call.timer);callState('Connecting…');
  try{await newPC();const o=await call.pc.createOffer();await call.pc.setLocalDescription(o);sig(cid,{t:'offer',sdp:o})}catch(e){toast('Could not start the call.',1);endCall('failed',true)}}
 else if(p.t==='offer'&&call.pc){try{await call.pc.setRemoteDescription(p.sdp);await flush();const a=await call.pc.createAnswer();await call.pc.setLocalDescription(a);sig(cid,{t:'answer',sdp:a})}catch(e){toast('Could not connect the call.',1);endCall('failed',true)}}
 else if(p.t==='answer'&&call.pc){try{await call.pc.setRemoteDescription(p.sdp);await flush()}catch(_){endCall('failed',true)}}
 else if(p.t==='ice'&&p.c){if(call.pc&&call.pc.remoteDescription)call.pc.addIceCandidate(p.c).catch(()=>{});else call.pending.push(p.c)}
 else if(p.t==='decline'){toast(p.busy?'User is busy.':'Call declined.',1);endCall('missed',false)}
 else if(p.t==='end'){endCall(call.ok?'':'missed',false)}
}
async function acceptCall(){
 if(!call||call.dir!=='in')return;clearTimeout(call.timer);
 try{call.stream=await media(call.kind)}catch(e){toast(e.message,1);sig(call.cid,{t:'decline'});return endCall('failed',false)}
 callUI(ringHtml('Connecting…','<button class="ib" style="background:#e11d48" data-a="xcall">'+ic('end')+'</button>'),call.kind==='video');
 if(call.kind==='video')$('#lv').srcObject=call.stream;
 try{await newPC();sig(call.cid,{t:'accept'});if(call.inviteId)dismissCallInvite(call.inviteId)}catch(e){toast('Could not start the call.',1);endCall('failed',true)}
}
function endCall(why,notifyPeer){
 if(!call)return;const c=call;call=null;clearTimeout(c.timer);
 if(notifyPeer)reliableCallEnd(c.cid,'end');
 if(c.inviteId)dismissCallInvite(c.inviteId);
 try{c.pc&&c.pc.close()}catch(_){}try{c.stream&&c.stream.getTracks().forEach(t=>t.stop())}catch(_){}
 const u=$('#callUI');u.hidden=true;u.innerHTML='';
 const p=peerOf(c.cid),out=c.dir==='out';
 const st=c.ok?(out?'outgoing ended':'incoming ended'):why==='failed'?(out?'outgoing failed':'incoming failed'):(out?'outgoing missed':'incoming missed');
 sb.from('call_logs').insert({user_id:me.id,peer_name:p.display_name||'Unknown',peer_identifier:p.user_id||'',call_type:c.kind,call_status:st}).then(()=>loadLogs().then(()=>{if(tab==='calls')render()}));
}

function setAndroidPushStatus(message){
 if(!window.DarkChat)return;
 window.DarkChat.statusText=String(message||'FCM status unknown').slice(0,260);
 const target=$('#nativePushStatus');if(target)target.textContent=window.DarkChat.statusText;
}
window.DarkChat={
 _t:null,_busy:false,_retryTimer:null,_registeredUser:null,statusText:'Waiting for Android FCM token...',
 registerPushToken:async function(t){
  if(!t)return false;
  this._t=t;
  if(!me||!sb){setAndroidPushStatus('FCM token ready. Sign in to register it.');return false}
  if(this._busy)return false;
  if(this._retryTimer){clearTimeout(this._retryTimer);this._retryTimer=null}
  this._busy=true;
  setAndroidPushStatus('FCM token received. Registering with Supabase...');
  try{
   const {data,error}=await sb.from('device_push_tokens').upsert({
    user_id:me.id,fcm_token:t,platform:'android',package_name:'com.darkchat.app',
    last_seen_at:new Date().toISOString()
   },{onConflict:'fcm_token'}).select('id,user_id').single();
   if(error)throw error;
   if(!data||data.user_id!==me.id)throw new Error('Token registration not confirmed');
   this._registeredUser=me.id;
   setAndroidPushStatus('FCM registered for this account. Check Android notification permission.');
   return true;
  }catch(error){
   console.warn('DARK CHAT FCM token registration failed:',error?.message||error);
   this._registeredUser=null;
   setAndroidPushStatus('FCM registration failed: '+(error?.message||'network error'));
   this._retryTimer=setTimeout(()=>{
    this._retryTimer=null;
    if(me&&this._t&&this._registeredUser!==me.id)this.registerPushToken(this._t);
   },20000);
   return false;
  }finally{this._busy=false}
 },
 requestNotificationPermission:async()=>{
  if(window.DarkChatDevice){window.DarkChatDevice.requestPermission();return 'Android notification permission requested'}
  if(!('Notification' in window))return 'Android app required for push permissions';
  return Notification.requestPermission()
 }
};
window.addEventListener('darkchat-fcm-token',e=>{
 const t=e.detail?.token;
 if(t)window.DarkChat.registerPushToken(t)
});
window.addEventListener('darkchat-native-push-status',e=>{
 const d=e.detail||{},msg=String(d.message||'');
 if(d.status==='missing_play_services')setAndroidPushStatus('FCM unavailable: Google Play services missing on this device.');
 else if(d.status==='token_error')setAndroidPushStatus('FCM token error: '+msg);
 else if(d.status==='notification_blocked')setAndroidPushStatus('FCM token may be ready, but Android notifications are blocked. Enable permission.');
 else if(d.status==='checking'&&!window.DarkChat._t)setAndroidPushStatus('Checking Firebase and Google Play services...');
});

});

function cartProducts(){return cart.map(item=>({item,product:products.find(p=>p.id===item.id&&p.active)})).filter(x=>x.product)}
function checkoutProducts(){
 if(checkoutMode==='single'){
  const p=products.find(x=>x.id===singleProductId&&x.active);
  return p?[{item:{id:p.id,quantity:1},product:p}]:[];
 }
 return cartProducts();
}

async function render(){
 if(!me||!root())return;
 if(loading)return;loading=true;
 const node=root(); // Keep current store content until fresh data is ready.
 try{
  readCart();await fetchData();
  if(view==='auto')view=myStore?'my':'cart';
  if(!node.isConnected)return;
  node.innerHTML=tabs()+(view==='my'?renderMy():view==='cart'?renderCart():view==='checkout'?renderCheckout():view==='detail'?renderDetail():view==='orders'?renderBuyerOrders():renderBrowse());
  if(lastRenderedStoreView!==view){const scrollPanel=document.getElementById('list');if(scrollPanel)scrollPanel.scrollTop=0;lastRenderedStoreView=view;}
  attachRealtime();attachRequestRealtime();
 }catch(e){node.innerHTML=card('<h3>Store unavailable</h3><p>'+h(e.message)+'</p>'+btn('reload','Try again'))}
 finally{loading=false}
}
async function upload(file,type){
 if(!file||!file.size)return null;
 if(file.size>5*1048576||!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))
  throw new Error('Choose a PNG, JPG, WEBP or GIF under 5 MB.');
 const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[file.type];
 const path=me.id+'/'+type+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;
 const {error}=await sb.storage.from('darkchat-store-images').upload(path,file,{contentType:file.type});
 confirmErr(error);return path;
}
async function uploadPaymentReceipt(file){
 if(!file||!file.size||file.size>5*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type))
  throw new Error('Upload a PNG, JPG or WEBP screenshot under 5 MB.');
 const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[file.type];
 const path=me.id+'/'+crypto.randomUUID()+'.'+ext;
 const {error}=await sb.storage.from('dc-order-receipts').upload(path,file,{contentType:file.type});
 confirmErr(error);return path;
}
async function viewReceipt(path){
 const {data,error}=await sb.storage.from('dc-order-receipts').createSignedUrl(path,300);
 confirmErr(error);if(!data?.signedUrl)throw new Error('Unable to open receipt');
 document.getElementById('dc-order-receipt-viewer')?.remove();
 const overlay=document.createElement('div');overlay.id='dc-order-receipt-viewer';
 overlay.innerHTML='<div class="preview-box"><h3>Payment screenshot</h3><p style="font-size:12px;color:#cbb9da">Compare the TID with the payment you received before confirming.</p><img alt="Buyer payment screenshot" src="'+h(data.signedUrl)+'"><button type="button" class="btn g" data-close-receipt="yes">Close</button></div>';
 document.body.appendChild(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-close-receipt]'))overlay.remove()});
}
async function submit(form){
 const type=form.dataset.f,d=new FormData(form),val=n=>String(d.get(n)||'').trim(),owner=me.id;
 const submitBtn=form.querySelector('[type=submit]');if(submitBtn)submitBtn.disabled=true;
 try{
  if(type==='request'){
   if(requests.some(x=>x.status==='pending'))throw new Error('You already have a pending request. Wait for admin approval.');
   const reference=val('transfer_reference');
   if(!reference)throw new Error('Enter a transaction reference');
   const method=val('payment_method');
   if(method==='google_pay'&&!isHttps(settings.google_pay_checkout_url))throw new Error('Google Pay is not configured');
   const file=d.get('store_payment_receipt');
   if(!file||!file.size||file.size>5*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type))
     throw new Error('Attach a clear JPG, PNG or WEBP payment screenshot under 5 MB.');
   const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[file.type];
   const receiptPath=owner+'/activation/'+crypto.randomUUID()+'.'+ext;
   const {error:uploadError}=await sb.storage.from('dc-store-receipts').upload(receiptPath,file,{contentType:file.type,cacheControl:'0',upsert:false});
   confirmErr(uploadError);
   const {error}=await sb.from('dc_store_requests').insert({user_id:owner,payment_method:method,transfer_reference:reference,receipt_path:receiptPath});
   if(error){try{await sb.storage.from('dc-store-receipts').remove([receiptPath])}catch(_){}confirmErr(error)}
   message('TID and payment screenshot sent privately. Admin must verify your payment.');
  }else if(type==='profile'){
   const {error}=await sb.from('dc_stores').update({
    store_name:val('store_name'),description:val('description'),
    welcome_message:val('welcome_message'),
    auto_reply_enabled:d.has('auto_reply_enabled')
   }).eq('owner_id',owner);confirmErr(error);message('Store profile saved');
  }else if(type==='payments'){
   const keys=['payment_jazzcash_number','payment_jazzcash_name','payment_easypaisa_number','payment_easypaisa_name','payment_bank_details'];
   const row={};for(const k of keys)row[k]=val(k).slice(0,k==='payment_bank_details'?2000:120)||null;
   if(row.payment_jazzcash_number&&!/^[-+()0-9\s]{9,40}$/.test(row.payment_jazzcash_number))throw new Error('Check your JazzCash number');
   if(row.payment_easypaisa_number&&!/^[-+()0-9\s]{9,40}$/.test(row.payment_easypaisa_number))throw new Error('Check your Easypaisa number');
   const {error}=await sb.from('dc_stores').update(row).eq('owner_id',owner);confirmErr(error);message('Receiving payment accounts saved');
  }else if(type==='category'){
   if(!val('keyword_id'))throw new Error('Select the parent keyword first');
   const path=await upload(d.get('image'),'categories');
   const {error}=await sb.from('dc_store_categories').insert({owner_id:owner,name:val('name'),keyword_id:val('keyword_id'),image_path:path});
   confirmErr(error);message('Category added');
  }else if(type==='product'){
   const price=Number(val('price_pkr'));if(!Number.isFinite(price)||price<=0)throw new Error('Enter a valid price');
   const path=await upload(d.get('image'),'products');
   const {error}=await sb.from('dc_store_products').insert({owner_id:owner,
    name:val('name'),price_pkr:price,description:val('description'),
    category_id:val('category_id')||null,stock:val('stock')?Number(val('stock')):null,image_path:path});
   confirmErr(error);message('Product added');
  }else if(type==='keyword'){
   const keyword=val('keyword').toLowerCase(),rt=val('response_type'),target=val('target_id');
   const row={owner_id:owner,keyword,response_type:rt,response_text:val('response_text'),target_id:['text','menu'].includes(rt)?null:target||null};
   if(['product','category'].includes(rt)&&!row.target_id)throw new Error('Choose a linked product or category');
   if(rt==='text'&&!row.response_text)throw new Error('Enter the automatic reply text or link');
   const {error}=await sb.from('dc_store_keywords').upsert(row,{onConflict:'owner_id,keyword'});
   confirmErr(error);message('Auto-reply keyword saved');
  }else if(type==='checkout'){
   const items=checkoutProducts(),name=val('customer_name'),phone=val('customer_phone');
   const address=val('delivery_address'),notes=val('notes');
   const paymentMethod=val('payment_method'),paymentRef=val('payment_reference');
   if(!items.length)throw new Error('No products selected');
   if(name.length<2||phone.length<7)throw new Error('Enter a valid name and phone number');
   if(address.length<8)throw new Error('Enter your complete house, street, area and city address');
   const sellerId=items[0].product.owner_id;
   if(items.some(x=>x.product.owner_id!==sellerId))throw new Error('Checkout must be from one seller');
   const seller=stores.find(s=>s.owner_id===sellerId);
   if(!paymentOptions(seller).some(o=>o.id===paymentMethod))throw new Error('Seller payment method is not available');
   if(paymentRef.length<4)throw new Error('Enter a valid transaction reference');
   const file=d.get('payment_receipt');
   const receiptPath=await uploadPaymentReceipt(file);
   const group=crypto.randomUUID();
   const data=items.map(x=>({checkout_id:group,product_id:x.product.id,store_owner_id:sellerId,buyer_id:owner,
    quantity:x.item.quantity,customer_name:name,customer_phone:phone,delivery_address:address,notes,
    payment_method:paymentMethod,payment_reference:paymentRef,payment_receipt_path:receiptPath,payment_submitted_at:new Date().toISOString()}));
   const {data:placed,error}=await sb.from('dc_store_orders').insert(data).select('id');
   if(error){await sb.storage.from('dc-order-receipts').remove([receiptPath]).catch(()=>{});throw error}
   if(checkoutMode==='cart'){cart=[];saveCart()}
   message('Order and payment screenshot sent. Seller will verify payment manually.');
   (placed||[]).forEach(x=>sb.functions.invoke('darkchat-send-push',{body:{order_id:x.id}}).catch(()=>{}));
   checkoutMode='cart';singleProductId=null;view='orders';

  }
  invalidateStoreCache();
  await render();
 }catch(e){message(e.message||'Request failed',true);if(submitBtn)submitBtn.disabled=false}
}
async function action(button){
 const op=button.dataset.s,id=button.dataset.id;
 if(['browse','my','cart','orders'].includes(op)){view=op;return render()}
 if(op==='copyShopLink'||op==='shareShopLink'){
  const url=publicSellerLink();
  if(!url)return message('The download website link is not configured by the admin yet.',true);
  if(op==='shareShopLink'&&navigator.share){
   try{await navigator.share({title:'Chat with '+myStore.store_name,text:'Message me on DARK CHAT and shop my products.',url});return}catch(e){if(e?.name==='AbortError')return;}
  }
  try{await navigator.clipboard.writeText(url);message('Your seller chat link was copied!')}
  catch(_){const f=document.querySelector('#dc-seller-link');if(f){f.focus();f.select()}message('Select and copy your link above.');}
  return;
 }
 if(op==='reload')return render();
 if(op==='detailback'){view='detail';return render()}
 if(op==='copy-number'){try{await navigator.clipboard.writeText(settings.jazzcash_number);message('JazzCash number copied.')}catch(_){message('Copy the number above.')}return}
 if(op==='pick'){picked=id;keywordSearch='';return render()}
 if(op==='details'){detailId=id;view='detail';return render()}
 if(op==='copySellerAccount'){
  const chosen=root()?.querySelector('select[name=payment_method]')?.value;
  const sellerId=checkoutProducts()[0]?.product?.owner_id;
  const choice=paymentOptions(stores.find(x=>x.owner_id===sellerId)).find(x=>x.id===chosen);
  if(!choice)return message('Payment account not found',true);
  try{await navigator.clipboard.writeText(choice.detail);message('Seller payment details copied.')}catch(_){message('Copy the payment details displayed above.')}
  return;
 }
 if(op==='confirmOrder'||op==='rejectOrder'){
  if(!myStore)return message('Only the seller can review an order',true);
  const order=orders.find(o=>o.id===id);
  if(!order||order.status!=='new')return message('This order has already been reviewed',true);
  const accepted=op==='confirmOrder';
  if(accepted&&!order.payment_receipt_path)return message('Payment screenshot is missing. Do not approve this order.',true);
  const prompt=accepted?'Confirm this order? First check that Rs. '+order.total_pkr+' has actually arrived in your account. This also marks the payment as VERIFIED.':
   'Reject this order? This cancels the order and marks its payment as REJECTED. The buyer will receive a message.';
  if(!confirm(prompt))return;
  button.disabled=true;
  try{
   const changes=accepted?{status:'accepted',payment_status:'verified'}:{status:'cancelled',payment_status:'rejected'};
   const {data,error}=await sb.from('dc_store_orders').update(changes).eq('id',id).eq('store_owner_id',me.id).eq('status','new').select('id');
   confirmErr(error);
   if(!data?.length)throw new Error('Order is no longer waiting for review');
   invalidateStoreCache();
   message(accepted?'Order confirmed. Buyer notified in chat.':'Order rejected. Buyer notified in chat.');
   pushConfirmationMessage(id).catch(()=>{});
   await render();
  }catch(e){button.disabled=false;message(e.message||'Could not review order',true)}
  return;
 }
 if(op==='receipt')return viewReceipt(button.dataset.path);
 if(op==='cartcheckout'){
  const item=cartProducts(),owners=new Set(item.map(x=>x.product.owner_id));
  if(owners.size!==1)return message('Checkout one store at a time',true);
  checkoutMode='cart';singleProductId=null;view='checkout';return render();
 }
 if(op==='add'||op==='buy'){
  const p=products.find(x=>x.id===id);if(!p)return message('Product not found',true);
  if(p.owner_id===me.id)return message('You cannot order your own product',true);
  if(p.stock!==null&&p.stock<=0)return message('This product is sold out',true);
  if(op==='buy'){detailId=p.id;singleProductId=p.id;checkoutMode='single';view='checkout';return render()}
  if(cart.length){
   const old=products.find(x=>x.id===cart[0].id);
   if(old&&old.owner_id!==p.owner_id){return message('Cart has items from another store. Checkout or clear them first.',true)}
  }
  const existing=cart.find(x=>x.id===id);
  if(existing)existing.quantity=Math.min(99,existing.quantity+1);else cart.push({id,quantity:1});
  saveCart();message('Added to cart');
  const n=root()?.querySelector('[data-s=cart]');if(n)n.textContent='Cart · '+cart.reduce((a,x)=>a+x.quantity,0);
  return;
 }
 if(op==='remove'){cart=cart.filter(x=>x.id!==id);saveCart();return render()}
 if(['delcat','delprod','delkey'].includes(op)){
  if(!confirm('Delete this item?'))return;
  const table={delcat:'dc_store_categories',delprod:'dc_store_products',delkey:'dc_store_keywords'}[op];
  const {error}=await sb.from(table).delete().eq('id',id).eq('owner_id',me.id);
  if(error)return message(error.message,true);invalidateStoreCache();message('Deleted');return render();
 }
}
async function change(select){
 if(!['status','paymentStatus'].includes(select.dataset.s))return;
 const column=select.dataset.s==='paymentStatus'?'payment_status':'status';
 if(column==='payment_status' && select.value==='verified'&&!confirm('Confirm only if money is received in your payment account. Continue?')){await render();return}
  const {error}=await sb.from('dc_store_orders').update({[column]:select.value})
   .eq('id',select.dataset.id).eq('store_owner_id',me.id);
  if(error){message(error.message,true);return}
  invalidateStoreCache();
  if(column==='status'&&select.value==='accepted'){
   message('✅ Order confirmed. The buyer will receive a message in your chat.');
   // Asynchronously also try the user's existing Android push notification route.
   pushConfirmationMessage(select.dataset.id);
  }else message('Order updated');
  await render();
}
function attachRequestRealtime(){
 if(requestChannel||!me)return;
 requestChannel=sb.channel('dc-store-activation-'+me.id)
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dc_store_requests',filter:'user_id=eq.'+me.id},payload=>{
   invalidateStoreCache();
   if(payload.new?.status==='approved')message('✅ Store approved! Your seller dashboard is now unlocked.');
   else if(payload.new?.status==='rejected')message('Your store payment request was rejected.',true);
   if(root())render();
 })
 .subscribe();
}
 function watchOrders(){
  if(!me||buyerOrderChannel)return;
  const accountId=me.id;
  buyerOrderChannel=sb.channel('dc-order-confirmation-'+accountId)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dc_store_orders',filter:'buyer_id=eq.'+accountId},({new:o,old:previous})=>{
    if(!o||me?.id!==accountId)return;
    invalidateStoreCache();
    const status=String(o.status||'');
    if(status==='accepted')message('✅ Seller confirmed your order! Open Store → My Orders.');
    else if(status==='shipped')message('📦 Your order has been shipped.');
    else if(status==='completed')message('✅ Your order is completed.');
    else if(status==='cancelled')message('⚠️ Your order was cancelled.',true);
    if(view==='orders'&&root())render();
   }).subscribe();
 }
 function stopOrders(){if(buyerOrderChannel){sb.removeChannel(buyerOrderChannel);buyerOrderChannel=null}}
 async function pushConfirmationMessage(orderId){
  // DB trigger creates the seller-authored order confirmation in the existing direct chat.
  // Dispatch its ordinary FCM chat push with the seller's authenticated session.
  try{
   const {data}=await sb.from('messages').select('id').eq('sender_id',me.id)
    .ilike('body','%'+orderId+'%').order('created_at',{ascending:false}).limit(1).maybeSingle();
   if(data?.id){const {error}=await sb.functions.invoke('darkchat-send-push',{body:{message_id:data.id}});
    if(error)console.warn('Order confirmation push could not be delivered',error.message)}
  }catch(e){console.warn('Order push not available',e?.message||e)}
 }
function attachRealtime(){
 if(!myStore||orderChannel)return;
 orderChannel=sb.channel('dc-seller-orders-'+me.id)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'dc_store_orders',filter:'store_owner_id=eq.'+me.id},()=>{invalidateStoreCache();message('🛍️ New store order received!');if(view==='my'&&root())render()})
 .subscribe();
}
 async function enrichMessage(m,element,c){
  // Supabase already sends an automatic message FROM the seller with store_product_id.
  // Only this genuine seller response gets the rich card, NEVER the buyer's keyword.
  if(!m||!me||!c||c.kind!=='direct'||m.deleted_at||!m.store_product_id)return;
  const sellerId=m.sender_id;
  if(!c.people.some(x=>x.user_id===sellerId) || !c.people.some(x=>x.user_id===me.id))return;
  const cacheKey='seller-product:'+sellerId+':'+m.store_product_id;
  if(!inlineKeywordCache.has(cacheKey))inlineKeywordCache.set(cacheKey,(async()=>{
   const {data,error}=await sb.from('dc_store_products').select('id,owner_id,name,description,price_pkr,image_path,stock,active')
    .eq('id',m.store_product_id).eq('owner_id',sellerId).eq('active',true).maybeSingle();
   if(error)throw error;
   return data;
  })());
  const p=await inlineKeywordCache.get(cacheKey).catch(()=>null);
  if(!p||!element.isConnected||element.dataset.mid!==m.id)return;
  const body=element.querySelector('.msgbody');if(!body||body.querySelector('.dc-chat-product'))return;
  const buyer=me.id!==sellerId;
  // The seller sees their automatically sent catalogue card, but cannot buy it.
  // Every buyer sees buttons on the SAME actual message received in their chat.
  const tile=document.createElement('div');tile.className='dc-chat-product';
  const unavailable=p.stock!==null&&Number(p.stock)<=0;
  tile.innerHTML=(p.image_path?'<img loading="lazy" alt="'+h(p.name)+'" src="'+h(photo(p.image_path))+'">':'<div class="dc-chat-no-photo">🛍️ Product photo</div>')+
   '<span class="dc-chat-product-label">'+(buyer?'FROM THIS SELLER':'YOUR AUTOMATIC PRODUCT REPLY')+'</span>'+
   '<strong>'+h(p.name)+'</strong><strong>'+money(p.price_pkr)+'</strong>'+
   '<small>'+h(p.description||'Contact the seller for more details.')+'</small>'+
   (p.stock===null?'':('<small>'+(unavailable?'Currently out of stock':'Available: '+h(p.stock))+'</small>'))+
   (buyer?'<div class="dc-chat-actions"><button type="button" class="secondary" data-dcchatcart="'+h(p.id)+'" '+(unavailable?'disabled':'')+'>Add to Cart</button><button type="button" data-dcchatbuy="'+h(p.id)+'" '+(unavailable?'disabled':'')+'>Buy Now</button></div><small class="dc-chat-buyer-hint">Order directly from this seller — no store required.</small>':
    '<small class="dc-chat-buyer-hint">Sent automatically to your customer.</small>');
  // Avoid repeating the machine-generated price/description as a long text above the card.
  body.innerHTML='<span class="dc-chat-card-caption">🛍️ Store product</span>';
  body.appendChild(tile);
 }
async function openProduct(id,buy){
 if(!me)return;
 detailId=id;singleProductId=id;checkoutMode='single';view=buy?'checkout':'detail';
 // Open checkout in the same conversation as a full-screen sheet, not via Store tab.
 let overlay=document.getElementById('dc-inline-checkout');
 if(!overlay){
  overlay=document.createElement('div');overlay.id='dc-inline-checkout';
  overlay.innerHTML='<div class="dc-inline-checkout-panel" role="dialog" aria-modal="true" aria-label="Buy product"><header><span>🛍️ Secure product checkout</span><button type="button" data-dc-close-checkout aria-label="Close checkout">✕ Close</button></header><div id="dc-store-root"></div></div>';
  document.body.appendChild(overlay);
 }
 await render();
}
function closeInlineCheckout(){
 const el=document.getElementById('dc-inline-checkout');if(el)el.remove();
 checkoutMode='cart';singleProductId=null;
 view=myStore?'my':'cart';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dc-close-checkout]');if(b){e.preventDefault();closeInlineCheckout();}});

window.DCStore={render,enrichMessage,openProduct,watchOrders,stopOrders,showSell:()=>{view='my';if(root())render();},openShop:()=>{view='auto';}};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-dcchatbuy],[data-dcchatcart]');if(!b)return;
 e.preventDefault();e.stopPropagation();const id=b.dataset.dcchatbuy||b.dataset.dcchatcart;
 if(b.dataset.dcchatcart){
  (async()=>{
   if(!me)throw Error('Log in to add products to your cart');
   let p=products.find(x=>x.id===id&&x.active);
   if(!p){
    const r=await sb.from('dc_store_products').select('id,owner_id,stock,active').eq('id',id).eq('active',true).maybeSingle();
    confirmErr(r.error);p=r.data;
   }
   if(!p)throw Error('This product is unavailable');
   if(p.owner_id===me.id)throw Error('You cannot buy your own product');
   if(p.stock!==null&&Number(p.stock)<=0)throw Error('This product is sold out');
   readCart();
   const others=cart.filter(x=>x.id!==id);
   if(others.length){
    const old=products.find(x=>x.id===others[0].id);
    const prior=old||((await sb.from('dc_store_products').select('owner_id').eq('id',others[0].id).maybeSingle()).data);
    if(prior&&prior.owner_id!==p.owner_id)throw Error('Your cart has a product from another seller. Complete that order first.');
   }
   const item=cart.find(x=>x.id===id);
   if(item)item.quantity=Math.min(item.quantity+1,99);else cart.push({id,quantity:1});
   saveCart();
   message('Added to your cart. Open Store → Cart to complete the order.');
   const bubble=b.closest('.dc-chat-product');
   if(bubble){
    const label=bubble.querySelector('.dc-chat-buyer-hint');
    if(label)label.textContent='Saved in your cart. Open Store → Cart to order.';
   }
  })().catch(x=>message(x.message||'Could not add to cart',true));
  return;
 }
 openProduct(id,true).catch(x=>message(x.message,true));
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b||!b.closest('#dc-store-root'))return;e.preventDefault();action(b).catch(x=>message(x.message,true))});
document.addEventListener('submit',e=>{const f=e.target.closest('#dc-store-root form[data-f]');if(!f)return;e.preventDefault();submit(f)});
document.addEventListener('change',e=>{
 const storeInput=e.target.closest('#dc-store-root input[name=store_payment_receipt]');
 if(storeInput){
  const target=document.getElementById('dcs-store-receipt-preview');
  if(!target)return;
  const file=storeInput.files?.[0];
  if(target.dataset.objectUrl){URL.revokeObjectURL(target.dataset.objectUrl);delete target.dataset.objectUrl}
  if(!file){target.textContent='📷 Screenshot preview will appear here';return}
  if(file.size>5*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type)){
   storeInput.value='';target.textContent='Choose PNG, JPG or WEBP under 5 MB';message('Invalid store payment screenshot',true);return
  }
  const url=URL.createObjectURL(file);target.dataset.objectUrl=url;
  const image=document.createElement('img');image.src=url;image.alt='Store payment receipt preview';
  target.replaceChildren(image,document.createTextNode(' '+file.name+' · '+Math.round(file.size/1024)+' KB'));
  return;
 }
 const receiptInput=e.target.closest('#dc-store-root input[name=payment_receipt]');
 if(receiptInput){
  const target=document.getElementById('dcs-upload-preview');if(!target)return;
  const file=receiptInput.files?.[0];
  if(target.dataset.objectUrl){URL.revokeObjectURL(target.dataset.objectUrl);delete target.dataset.objectUrl;}
  if(!file){target.innerHTML='<span>📷 Your receipt preview will appear here</span>';return;}
  if(file.size>5*1048576||!['image/png','image/jpeg','image/webp'].includes(file.type)){
   receiptInput.value='';target.innerHTML='<span>Choose a PNG, JPG or WEBP under 5 MB.</span>';message('Screenshot must be PNG, JPG or WEBP, under 5 MB',true);return;
  }
  const url=URL.createObjectURL(file);target.dataset.objectUrl=url;
  const image=document.createElement('img');image.src=url;image.alt='Payment screenshot preview';
  target.replaceChildren(image,document.createTextNode(file.name+' · '+Math.round(file.size/1024)+' KB'));
 }
});
document.addEventListener('change',e=>{
 const b=e.target.closest('#dc-store-root [data-s=status], #dc-store-root [data-s=paymentStatus]');
 if(b)change(b);
 const sel=e.target.closest('#dc-store-root [data-payment-select]');
 if(sel){const s=checkoutProducts()[0]?.product?.owner_id;
  const seller=stores.find(x=>x.owner_id===s),o=paymentOptions(seller).find(x=>x.id===sel.value);
  const box=document.getElementById('dcs-payment-instructions');
  if(box&&o){const items=checkoutProducts();const total=items.reduce((t,x)=>t+Number(x.product.price_pkr)*x.item.quantity,0);box.querySelector('b').textContent='Send '+money(total)+' via '+o.label;box.querySelector('p').textContent=o.detail;}
 }
});
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_OUT'){storeCacheReady=false;storeCacheUser=null;storeCacheTime=0;invalidateStoreCache();settings=null;stores=[];myStore=null;cart=[];view='browse';buyerOrders=[];singleProductId=null;detailId=null;if(orderChannel){sb.removeChannel(orderChannel);orderChannel=null}if(requestChannel){sb.removeChannel(requestChannel);requestChannel=null}}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&typeof tab!=='undefined'&&tab==='store'&&me&&root())render()});
})();
</script>

<script>
/* Public storefront, without a password or a temporary user account.
   Only the dedicated Edge Function can insert a guest order; browser has no service key. */
(function(){
"use strict";
const q=id=>document.getElementById(id),screen=q("dc-guest-shop"),body=q("dcg-content");
const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"Rs. "+Number(n||0).toLocaleString("en-PK");
let catalog={stores:[],products:[]},picked=null,product=null,guestBusy=false,guestFormValues={};
function getStore(){return catalog.stores.find(s=>s.owner_id===picked)}
function availablePayments(s){
 const p=[];
 if(s?.payment_jazzcash_number)p.push({id:"jazzcash",label:"JazzCash",details:"Number: "+s.payment_jazzcash_number+"\nAccount holder: "+(s.payment_jazzcash_name||"Not specified")});
 if(s?.payment_easypaisa_number)p.push({id:"easypaisa",label:"Easypaisa",details:"Number: "+s.payment_easypaisa_number+"\nAccount holder: "+(s.payment_easypaisa_name||"Not specified")});
 if(s?.payment_bank_details)p.push({id:"bank_transfer",label:"Bank Transfer",details:s.payment_bank_details});
 return p;
}
async function api(payload){
 const c=new AbortController(),kill=setTimeout(()=>c.abort(),30000);
 try{
  const res=await fetch(U+"/functions/v1/darkchat-guest-shop",{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:c.signal
  });
  const ans=await res.json().catch(()=>({}));
  if(!res.ok||!ans.ok)throw Error(ans.error||"Store service unavailable. Please try again.");
  return ans;
 }finally{clearTimeout(kill)}
}
function hideGuest(){screen.hidden=true;q("auth").hidden=false}
function showLogin(createAccount){
 hideGuest();if(createAccount&&typeof setMode==="function")setMode("signup");
}
function picture(path){
 return path?'<img loading="lazy" alt="Product photo" src="'+escape(U+"/storage/v1/object/public/darkchat-store-images/"+String(path).split("/").map(encodeURIComponent).join("/"))+'">':
  '<div style="height:120px;background:#291a45;display:grid;place-items:center">🛍️</div>';
}
function renderCatalog(){
 const stores=catalog.stores;
 if(!stores.length){body.innerHTML='<div class="dcg-card"><h2>No stores are available right now</h2><p>Please check back soon.</p></div>';return;}
 if(!getStore())picked=stores[0].owner_id;
 const s=getStore(),products=catalog.products.filter(p=>p.owner_id===picked);
 body.innerHTML='<div class="dcg-card"><h2>Shop on DARK CHAT</h2><p>Buy products without creating an account or paying a store fee. Enter your delivery details and submit your payment receipt directly to the seller.</p><button class="dcg-small" id="dcg-create">Want to sell? Get a store for Rs. 1,500</button></div>'+
 '<div class="dcg-card"><label class="dcg-label" for="dcg-seller">Choose a seller</label><select id="dcg-seller">'+stores.map(x=>'<option value="'+escape(x.owner_id)+'" '+(x.owner_id===picked?'selected':'')+'>'+escape(x.store_name)+'</option>').join('')+'</select><h3>'+escape(s.store_name)+'</h3><p>'+escape(s.description||"Products available for purchase")+'</p></div>'+
 '<h3 style="margin:16px 0">Available products</h3>'+
 '<div class="dcg-products">'+(products.map(p=>'<article class="dcg-product">'+picture(p.image_path)+'<div class="dcg-product-info"><b>'+escape(p.name)+'</b><small>'+money(p.price_pkr)+(p.stock===0?' · Sold out':'')+'</small><button class="dcg-cta" data-dcg-buy="'+escape(p.id)+'" '+(p.stock===0?'disabled':'')+'>Buy without account</button></div></article>').join('')||'<div class="dcg-card">This store has no available products.</div>')+'</div>';
}
function renderCheckout(){
 const s=getStore(),p=product;if(!s||!p)return renderCatalog();
 const payments=availablePayments(s);
 const selected=payments[0];
 body.innerHTML='<div class="dcg-card"><button class="dcg-small" id="dcg-continue">← Back to products</button><h2>Guest Checkout</h2><p>Account is optional. Payment goes directly to the seller; DARK CHAT does not automatically confirm your payment.</p><div class="dcg-pill">'+escape(s.store_name)+'</div><h3>'+escape(p.name)+'</h3><p>Price: <b>'+money(p.price_pkr)+'</b></p></div>'+
 (payments.length?'<form class="dcg-card" id="dcg-order"><h3>Your delivery details</h3><label class="dcg-label">Full name *</label><input name="customer_name" required minlength="2" maxlength="120" autocomplete="name"><label class="dcg-label">Phone *</label><input name="customer_phone" type="tel" inputmode="tel" required minlength="7" maxlength="28" autocomplete="tel"><label class="dcg-label">Complete delivery address *</label><textarea name="delivery_address" required minlength="8" maxlength="2000" autocomplete="street-address"></textarea>'+
 '<label class="dcg-label">Quantity *</label><input name="quantity" type="number" min="1" max="'+(p.stock===null?10:Math.max(1,Math.min(10,Number(p.stock))))+'" value="1" required><h3 style="margin-top:18px">Payment to seller</h3><label class="dcg-label">Payment method *</label><select id="dcg-pay-method" name="payment_method">'+payments.map(x=>'<option value="'+escape(x.id)+'">'+escape(x.label)+'</option>').join('')+'</select><div class="dcg-payment" id="dcg-pay-details">'+escape(selected.details)+'</div><p>Send the total shown above to this seller and enter the real transaction reference. The seller must verify the payment before approval.</p>'+
 '<label class="dcg-label">Transaction reference (TID) *</label><input name="payment_reference" required minlength="4" maxlength="100"><label class="dcg-label">Payment screenshot (PNG, JPG, WEBP) *</label><input name="payment_receipt" type="file" accept="image/png,image/jpeg,image/webp" required><label class="dcg-label">Note to seller (optional)</label><textarea name="notes" maxlength="1000"></textarea><div class="dcg-feedback" id="dcg-feedback"></div><button type="submit" class="dcg-cta" style="width:100%">Submit guest order</button></form>':
 '<div class="dcg-card"><p>This seller has not configured a receiving account yet. Please choose another store.</p></div>');
}
async function showGuest(){
 q("auth").hidden=true;q("boot").hidden=true;screen.hidden=false;
 if(catalog.stores.length){renderCatalog();return}
 body.innerHTML='<div class="dcg-card"><h3>Loading stores…</h3></div>';
 try{
  const data=await api({action:"catalog"});catalog=data;
  const invited=new URLSearchParams(location.search).get("chat");
  const invite=invited&&storesByUsername(invited);
  picked=invite?.owner_id||catalog.stores[0]?.owner_id||null;
  renderCatalog();
 }catch(e){body.innerHTML='<div class="dcg-card"><h3>Could not load stores</h3><p>'+escape(e.message)+'</p><button class="dcg-cta" id="dcg-retry">Try again</button></div>'}
}
function storesByUsername(username){return catalog.stores.find(x=>(x.owner_username||"").toLowerCase()===username.toLowerCase())}
async function b64(file){
 if(!file||!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5*1048576||file.size<100)throw Error("Upload a PNG, JPG, or WEBP screenshot under 5 MB.");
 return await new Promise((resolve,reject)=>{
  const r=new FileReader();r.onerror=()=>reject(Error("Could not read screenshot"));
  r.onload=()=>resolve(String(r.result).split(",")[1]);r.readAsDataURL(file);
 });
}
q("dc-guest-shop-start")?.addEventListener("click",showGuest);
q("dcg-back-login")?.addEventListener("click",()=>showLogin(false));
screen?.addEventListener("click",e=>{
 const id=e.target.id;
 if(id==="dcg-retry")showGuest();
 if(id==="dcg-create")showLogin(true);
 if(id==="dcg-continue"){product=null;renderCatalog()}
 const buy=e.target.closest("[data-dcg-buy]");
 if(buy){product=catalog.products.find(p=>p.id===buy.dataset.dcgBuy&&p.owner_id===picked)||null;renderCheckout()}
});
screen?.addEventListener("change",e=>{
 if(e.target.id==="dcg-seller"){picked=e.target.value;product=null;renderCatalog()}
 if(e.target.id==="dcg-pay-method"){const pay=availablePayments(getStore()).find(x=>x.id===e.target.value);const box=q("dcg-pay-details");if(box&&pay)box.textContent=pay.details}
 if(e.target.name==="quantity"){const qty=Math.max(1,Number(e.target.value)||1);const p=body.querySelector(".dcg-card p b");if(p&&product)p.textContent=money(Number(product.price_pkr)*qty)}
});
screen?.addEventListener("submit",async e=>{
 if(e.target.id!=="dcg-order")return;
 e.preventDefault();if(guestBusy)return;
 const form=e.target,feedback=q("dcg-feedback"),button=form.querySelector("[type=submit]");
 const data=new FormData(form),val=n=>String(data.get(n)||"").trim();
 guestBusy=true;button.disabled=true;button.textContent="Submitting your order…";feedback.textContent="Saving your order and private receipt…";feedback.classList.remove("bad");
 try{
  const file=data.get("payment_receipt");
  const receipt_base64=await b64(file);
  const result=await api({action:"checkout",store_owner_id:picked,product_id:product.id,quantity:Number(val("quantity")||1),
    customer_name:val("customer_name"),customer_phone:val("customer_phone"),delivery_address:val("delivery_address"),notes:val("notes"),
    payment_method:val("payment_method"),payment_reference:val("payment_reference"),receipt_type:file.type,receipt_base64});
  body.innerHTML='<div class="dcg-card"><h2>✅ Order submitted</h2><p>Your seller will check the payment receipt before accepting the order. You did not need to create an account.</p><p><b>Save this order number:</b></p><div class="dcg-payment">'+escape(result.order_id)+'</div><p>You can contact the seller with this reference if you need an update.</p><button class="dcg-cta" id="dcg-continue">Continue shopping</button><p style="margin-top:18px">Want a seller account? <button class="dcg-small" id="dcg-create">Create Account → Activate Store Rs. 1,500</button></p></div>';
  product=null;
 }catch(err){feedback.textContent=err?.message||"Could not submit order. Please try again.";feedback.classList.add("bad")}
 finally{guestBusy=false;button.disabled=false;button.textContent="Submit guest order"}
});
if(typeof sb!=="undefined"&&sb)sb.auth.onAuthStateChange((ev,session)=>{if(session?.user)screen.hidden=true;});
})();
</script>

</body></html>
