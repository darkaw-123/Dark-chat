plugins { id 'com.android.application' }
android {
    namespace 'com.darkaw.havelimystery'
    compileSdk 35
    defaultConfig {
        applicationId 'com.darkaw.havelimystery'
        buildConfigField 'String', 'PLAY_LICENSE_KEY', '""'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '1.9'
        manifestPlaceholders = [admobAppId:'ca-app-pub-7138311889196067~3028743078']
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { manifestPlaceholders = [admobAppId:'ca-app-pub-3940256099942544~3347511713'] }
        release { minifyEnabled false }
        // Locally installable preview with real ad IDs; debug key is not a release key.
        liveAds { initWith release; debuggable false; signingConfig signingConfigs.debug; matchingFallbacks = ['release'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
