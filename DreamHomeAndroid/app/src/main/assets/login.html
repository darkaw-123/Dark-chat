const $=id=>document.getElementById(id);let mode='signup',avatar=null,loadingPhoto=false;DreamAuth.ready.then(p=>{if(p)location.replace('index.html')});function setMode(m){mode=m;$('signupTab').classList.toggle('active',m==='signup');$('loginTab').classList.toggle('active',m==='login');$('avatarbox').style.display=m==='signup'?'block':'none';$('subtitle').textContent=m==='signup'?'Create an account to start designing.':'Welcome back. Continue designing.';$('username').placeholder=m==='signup'?'Choose a username':'Your username';$('password').autocomplete=m==='signup'?'new-password':'current-password';$('submit').textContent=m==='signup'?'Create account':'Log in';$('hint').innerHTML=m==='signup'?'Only a username and password are needed.<br>Photo is optional. Keep your password safe.':'Forgot your password? Ask the game admin to reset it.';$('error').textContent=''}$('signupTab').onclick=()=>setMode('signup');$('loginTab').onclick=()=>setMode('login');$('show').onclick=()=>{let p=$('password');p.type=p.type==='password'?'text':'password';$('show').textContent=p.type==='password'?'Show':'Hide'};$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){$('error').textContent='Choose a JPG, PNG or WebP photo under 5 MB.';return}loadingPhoto=true;$('submit').disabled=true;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=192;let g=c.getContext('2d'),scale=Math.max(192/img.width,192/img.height),w=img.width*scale,h=img.height*scale;g.drawImage(img,(192-w)/2,(192-h)/2,w,h);avatar=c.toDataURL('image/jpeg',.8);$('avatar').src=avatar;URL.revokeObjectURL(url);loadingPhoto=false;$('submit').disabled=false};img.onerror=()=>{URL.revokeObjectURL(url);$('error').textContent='Could not open that photo.';loadingPhoto=false;$('submit').disabled=false};img.src=url};$('form').onsubmit=async e=>{e.preventDefault();if(loadingPhoto)return;let u=$('username').value.trim(),pw=$('password').value;if(!/^[a-zA-Z0-9_]{3,24}$/.test(u)){ $('error').textContent='Use 3–24 letters, numbers or underscores for your username.';return}if(pw.length<8){$('error').textContent='Password must be at least 8 characters.';return}$('error').textContent='';$('submit').disabled=true;$('submit').textContent='Please wait…';try{if(mode==='signup')await DreamAuth.signup(u,pw,avatar);else await DreamAuth.signin(u,pw);$('password').value='';location.replace('index.html')}catch(e){$('error').textContent=e.message;$('submit').disabled=false;$('submit').textContent=mode==='signup'?'Create account':'Log in'}};
