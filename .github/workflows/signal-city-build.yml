name: Signal City release bundle
on:
  push:
    branches: [signal-city-apk-build]
    paths:
      - 'signal-city/**'
      - '.github/workflows/signal-city-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release AAB
        working-directory: signal-city
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Signal_City_Unsigned_AAB
          path: signal-city/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
