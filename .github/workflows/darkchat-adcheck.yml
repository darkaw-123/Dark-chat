name: Dark Chat separate Google test banner
on:
  push:
    branches: [darkchat-adcheck]
    paths:
      - 'diagnostics/**'
      - '.github/workflows/darkchat-adcheck.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated test-only APK
        run: gradle -p diagnostics :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Dark_Chat_Google_Test_Ad_APK
          path: diagnostics/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
