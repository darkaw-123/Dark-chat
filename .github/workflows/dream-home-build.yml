name: Build Dream Home Android
on:
  push:
    branches: [dream-home-android-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APKs
        working-directory: DreamHomeAndroid
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DreamHome-unsigned-and-test
          path: |
            DreamHomeAndroid/app/build/outputs/apk/debug/*.apk
            DreamHomeAndroid/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
