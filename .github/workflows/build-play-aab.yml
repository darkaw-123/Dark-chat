name: Dark Chat V9.14 — Google Play signed AAB (com.darkaw.darkchat)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-play-aab.yml'

jobs:
  play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DC_RELEASE_KEYSTORE_B64: ${{ secrets.DARKCHAT_RELEASE_KEYSTORE_B64 }}
      DARKCHAT_RELEASE_STORE_PASSWORD: ${{ secrets.DARKCHAT_RELEASE_STORE_PASSWORD }}
      DARKCHAT_RELEASE_KEY_ALIAS: ${{ secrets.DARKCHAT_RELEASE_KEY_ALIAS }}
      DARKCHAT_RELEASE_KEY_PASSWORD: ${{ secrets.DARKCHAT_RELEASE_KEY_PASSWORD }}
      DARKCHAT_FIREBASE_JSON_B64: ${{ secrets.DARKCHAT_FIREBASE_JSON_B64 }}
    steps:
      - name: Checkout original Dark Chat V9.14 sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" 'platforms;android-36' >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Install new Firebase file and verify Play package
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DARKCHAT_FIREBASE_JSON_B64:-}" ]; then
            umask 077
            printf '%s' "$DARKCHAT_FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("app/google-services.json").read_text())
          names=[client.get("client_info",{}).get("android_client_info",{}).get("package_name") for client in config.get("client",[])]
          assert "com.darkaw.darkchat" in names, "New Firebase google-services.json is required for com.darkaw.darkchat. Upload it to this repo or configure Actions secret DARKCHAT_FIREBASE_JSON_B64."
          gradle=Path("app/build.gradle").read_text()
          assert "applicationId 'com.darkaw.darkchat'" in gradle
          assert "versionName '9.14'" in gradle
          assert "versionCode 26" in gradle
          assert "com.android.billingclient:billing:9.1.0" in gradle
          assert "BuildConfig.PLAY_STORE_BUILD" in Path("app/src/main/java/com/darkchat/app/MainActivity.java").read_text()
          assert "darkchat_store_activation" in Path("app/src/main/java/com/darkchat/app/PlayStoreBilling.java").read_text()
          assert "targetSdk 36" in gradle
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert "ca-app-pub-7138311889196067~7564520939" in manifest
          print("Firebase Android client and Dark Chat Play settings confirmed.")
          PY
      - name: Restore existing production signing identity
        shell: bash
        run: |
          set -euo pipefail
          for key in DC_RELEASE_KEYSTORE_B64 DARKCHAT_RELEASE_STORE_PASSWORD DARKCHAT_RELEASE_KEY_ALIAS DARKCHAT_RELEASE_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Production signing secret unavailable. Build unsigned AAB for PRIVATE signing with the owner's existing key."
              exit 0
            fi
          done
          umask 077
          printf '%s' "$DC_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/darkchat-release.jks"
          echo "DARKCHAT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/darkchat-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/darkchat-release.jks" -storepass "$DARKCHAT_RELEASE_STORE_PASSWORD" -alias "$DARKCHAT_RELEASE_KEY_ALIAS" >/dev/null
      - name: Restore original Dark Chat launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/assets/dark_chat_logo_new.webp.b64 > app/src/main/res/drawable-nodpi/dark_chat_logo.webp
      - name: Create signed Google Play bundle
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease -PdarkChatPlay=true --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          if [ -n "${DARKCHAT_RELEASE_KEYSTORE_FILE:-}" ]; then
            jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > /tmp/aab-signature-report.txt
            grep -q 'jar verified' /tmp/aab-signature-report.txt
            echo "Release AAB signed with existing production identity."
          else
            echo "UNSIGNED Play AAB generated: must be signed privately before Play Console upload."
          fi
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/DarkChat_V9_14_com.darkaw.darkchat_Play_Release.aab
          if [ -s app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/DarkChat_V9_14_com.darkaw.darkchat_Play_Unsigned.apk
          elif [ -s app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/DarkChat_V9_14_com.darkaw.darkchat_Play_Unsigned.apk
          else
            echo "::error::Play variant APK missing"
            exit 1
          fi
      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_com_darkaw_chat_SIGNED_PLAY_AAB
          path: dist/
          if-no-files-found: error
