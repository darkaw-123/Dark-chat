name: Build DARK CHAT V9.5 Android 16 Play-Compatible AAB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-play-aab.yml'
jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout DARK CHAT V9.5 sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" 'platforms;android-36' >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Apply Play-required target API 36 only to this build
        run: |
          sed -i 's/compileSdk 35/compileSdk 36/; s/targetSdk 35/targetSdk 36/' app/build.gradle
          sed -i "s/version '8.9.2'/version '8.10.1'/" build.gradle
          grep -F 'compileSdk 36' app/build.gradle
          grep -F 'targetSdk 36' app/build.gradle
          grep -F "version '8.10.1'" build.gradle
          grep -F "versionName '9.5'" app/build.gradle
          grep -F "applicationId 'com.darkchat.app'" app/build.gradle
      - name: Use the user-supplied DARK CHAT D icon
        shell: bash
        run: |
          test -s app/src/main/assets/dark_chat_logo_new.webp.b64
          find app/src/main/res -type f -name 'dark_chat_logo.*' -delete
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/assets/dark_chat_logo_new.webp.b64 > app/src/main/res/drawable-nodpi/dark_chat_logo.webp
          test "$(wc -c < app/src/main/res/drawable-nodpi/dark_chat_logo.webp)" -gt 2500
      - name: Bundle release APK code as unsigned AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Upload API36 unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_5_PLAY_API36_UNSIGNED_AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish unsigned Play-target bundle for local signing
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/bundle/release/app-release.aab Dark-Chat-v9.5-API36-unsigned.aab
          gh release upload v9.5 Dark-Chat-v9.5-API36-unsigned.aab --clobber --repo "$GITHUB_REPOSITORY"
