name: Build Haveli Mystery
on:
  push:
    branches: [haveli-mystery-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test and live-ad APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleLiveAds
      - uses: actions/upload-artifact@v4
        with:
          name: Haveli-Mystery-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Haveli-Mystery-live-ads-APK
          path: app/build/outputs/apk/liveAds/*.apk
          if-no-files-found: error
