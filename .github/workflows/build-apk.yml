name: Build DARK CHAT V9.14 DEBUG APK with FCM and Google Test Ads
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK from GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate bundled V9 HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          for v in ['DCChatReceiveDeepLink','darkchat-fcm-token','darkchat-open-call','darkchat-send-push','prepareOutgoing(call)','iceCandidatePoolSize:2','editAvatarCrop(file)','dc_hidden_chats','DC_DEFAULT_AVATAR','restoreHiddenChat','removefriend','dc-avatar-viewer','dc-crop-overlay']:
              assert v in s, f'Missing V9 feature {v}'
          assert "ringHtml('Connecting…'" not in s
          assert "callState('Connecting…')" not in s
          assert '__DC_DEFAULT_AVATAR_BASE64__' not in s, 'Default avatar was not embedded'
          assert 'Obsidian Glow UI' not in s, 'V9.11 redesign must not be used'
          print('Validated V9.14 HTML',len(s),'characters')
          PY
      - name: Validate inline JavaScript parsing and guest purchase links
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          page=Path('app/src/main/assets/index.html').read_text()
          for text in ['id="dc-guest-shop"','Open Store · Rs. 1,500','darkchat-guest-shop','store_payment_receipt','receipt_path:receiptPath',
                       "contactAliases[other(c).user_id]","saveContactAlias(","dc-chat-search-results","renamefriend:","searchchats:",'id="fn"',"blockedUsers=new Set()","loadBlockedUsers()","blockfriend:","unblockfriend:","New message from an unsaved contact","dc-saved-contact-actions",">⛔ Block Contact</button>","dc-signup-photo","saveSignupPhoto(","dc_create_group_with_invites","dc_respond_group_invite","dc_pending_group_invites","dc_update_group_profile","renderMessageTick(","dc_mark_direct_receipts","dc_mark_all_direct_delivered","groupFriendRows()","Accept</button>"]:
              assert text in page, f'Missing guest store integration: {text}'
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',page,flags=re.I)
          assert 'id="dc-guest-shop-start"' not in page, 'Shopping button must not appear on login page'
          assert 'id="dc-chat-search"' in page, 'Search input must be available below status'
          assert len(blocks)>=3, f'Expected all app inline scripts, found {len(blocks)}'
          for i,block in enumerate(blocks):
              if block.strip():Path(f'/tmp/darkchat-js-{i}.js').write_text(block)
          print('Validated guest store hooks and extracted',len(blocks),'scripts')
          PY
          for f in /tmp/darkchat-js-*.js; do node --check "$f"; done
      - name: Validate public guest catalog API
        continue-on-error: true
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30             -H "Content-Type: application/json" -d '{"action":"catalog"}'             https://owdrctmlktonguztakau.supabase.co/functions/v1/darkchat-guest-shop             | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d.get("ok")==True,d.get("error");assert isinstance(d.get("stores"),list) and isinstance(d.get("products"),list);print("Guest catalog reachable:",len(d["stores"]),"stores,",len(d["products"]),"products")'
      - name: Export HTML source
        run: |
          mkdir -p dist
          cp app/src/main/assets/index.html dist/Dark_Chat_V9_14.html
      - name: Upload V9 HTML source
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_HTML_Source
          path: dist/
      - name: Install Dark Chat custom purple D launcher icon
        shell: bash
        run: |
          test -s app/src/main/assets/dark_chat_logo_new.webp.b64
          find app/src/main/res -type f -name 'dark_chat_logo.*' -delete
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/assets/dark_chat_logo_new.webp.b64 > app/src/main/res/drawable-nodpi/dark_chat_logo.webp
          file app/src/main/res/drawable-nodpi/dark_chat_logo.webp
          test "$(wc -c < app/src/main/res/drawable-nodpi/dark_chat_logo.webp)" -gt 2500
      - name: Validate notification and login-switch fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java=Path('app/src/main/java/com/darkchat/app/MainActivity.java').read_text()
          service=Path('app/src/main/java/com/darkchat/app/DarkChatMessagingService.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          for check in ['POST_NOTIFICATIONS','FirebaseMessaging.getInstance().getToken()', 'updateNotificationPermissionStatus()', 'openAppNotificationSettings()', 'areNotificationsEnabled()','getNotificationChannel(']:
              assert check in java or check in manifest, check
          for check in ['onNewToken(', 'onMessageReceived(', 'incoming_call', 'IMPORTANCE_HIGH', 'showRegularMessage']:
              assert check in service,check
          for check in ["FCM token logout cleanup", "pushsettings:", "notification_blocked", "notification_enabled", "device_push_tokens"]:
              assert check in html,check
          assert "versionName '9.14'" in Path('app/build.gradle').read_text()
          print('Notification permission, FCM, call alert and account-switch regression checks passed.')
          PY
      - name: Verify live-AdMob diagnostic patch and adaptive banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java=Path('app/src/main/java/com/darkchat/app/MainActivity.java').read_text()
          html=Path('app/src/main/assets/index.html').read_text()
          checks=['ca-app-pub-7138311889196067/3355094444', 'getCurrentOrientationAnchoredAdaptiveBannerAdSize', 'lastAdStatus', 'public String adStatus()', 'public void retryAd()', 'onAdFailedToLoad']
          for name in checks: assert name in java, name
          assert 'data-a="adstatus"' in html and 'adretry:' in html
          assert 'versionCode 25' in Path('app/build.gradle').read_text()
          print('Real AdMob unit, diagnostics and V9.14 version confirmed')
          PY
      - name: Validate Android app label and secure screen-capture flag
        run: |
          grep -F 'android:label="Dark Chat"' app/src/main/AndroidManifest.xml
          grep -F 'WindowManager.LayoutParams.FLAG_SECURE' app/src/main/java/com/darkchat/app/MainActivity.java
      - name: Build V9.14 APK and Android App Bundles
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Collect unsigned release APK and SDK signing tool for private signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/unsigned-release
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/unsigned-release/app-release-unsigned.apk
          apktool="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -n "$apktool"
          cp "$(dirname "$apktool")/lib/apksigner.jar" dist/unsigned-release/apksigner.jar
          test -s dist/unsigned-release/apksigner.jar
      - name: Upload unsigned release for private signing (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_UNSIGNED_APK_AND_SIGNER_FOR_PRIVATE_SIGNING
          path: dist/unsigned-release/
          if-no-files-found: error
      - name: Upload debug AAB (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_DEBUG_AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
      - name: Upload unsigned release AAB (requires release signing before Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_UNSIGNED_RELEASE_AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # Debug builds are never published as public production releases.
      - name: Upload DEBUG APK with Google Test Ads
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_14_DEBUG_TEST_ADS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
