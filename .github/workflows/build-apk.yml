name: Build DARK CHAT APK with Free FCM
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK from GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Store JavaScript syntax
        run: node --check app/src/main/assets/store.js
      - name: Export HTML source
        run: |
          mkdir -p dist
          cp app/src/main/assets/index.html dist/Dark_Chat_v1_5_User.html
          cp app/src/main/assets/store.js dist/store.js
      - name: Upload v1.5 source
        uses: actions/upload-artifact@v4
        with:
          name: Dark_Chat_v1_5_User_Source
          path: dist/
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_FREE_FCM_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish permanent public APK download (v1.4)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dark-Chat-v1.5.apk
          if gh release view v1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.5 Dark-Chat-v1.5.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.5 Dark-Chat-v1.5.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dark Chat v1.5 — Marketplace APK" \
              --notes "Dark Chat v1.5: stores, JazzCash store purchase requests with admin approval, C Anyway auto replies, product listings, orders and sponsored announcement banners. Android 8.0+."
          fi
