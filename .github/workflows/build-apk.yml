name: Build DARK CHAT V9 APK with FCM and AdMob
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK from GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate bundled V9 HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          for v in ['DCChatReceiveDeepLink','darkchat-fcm-token','darkchat-open-call','darkchat-send-push']:
              assert v in s, f'Missing V9 feature {v}'
          print('Validated V9 HTML',len(s),'characters')
          PY
      - name: Export HTML source
        run: |
          mkdir -p dist
          cp app/src/main/assets/index.html dist/Dark_Chat_V9.html
      - name: Upload V9 HTML source
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_HTML_Source
          path: dist/
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK_CHAT_V9_FCM_ADMOB_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish V9 APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dark-Chat-v9.apk
          if gh release view v9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v9 Dark-Chat-v9.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v9 Dark-Chat-v9.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DARK CHAT V9 — FCM + AdMob Test Banner APK" \
              --notes "Dark Chat V9: seller direct deep links, chat keyword product cards, checkout, payment receipt, seller order notifications, Firebase FCM for calls/messages, and Google Mobile Ads SDK with debug test banner. Android 8.0+."
          fi
