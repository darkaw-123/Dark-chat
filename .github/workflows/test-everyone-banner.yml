name: Test Dark Chat banner on Android
on:
  push:
    branches: [darkchat-everyone-ads-test]
    paths: ['.github/workflows/test-everyone-banner.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Dark Chat with Google test banner
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify automatic test banner
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -g app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.darkaw.darkchat -c android.intent.category.LAUNCHER 1
            sleep 75
            adb logcat -d -s DarkChatAds:I > /tmp/darkchat-ads.log
            cat /tmp/darkchat-ads.log
            grep -q 'Google TEST banner loaded successfully' /tmp/darkchat-ads.log
