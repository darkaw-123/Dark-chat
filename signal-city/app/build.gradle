plugins { id 'com.android.application' }
android {
    namespace 'com.signalcity.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.signalcity.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId:'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField 'String', 'REWARDED_AD_UNIT', '"ca-app-pub-3940256099942544/5224354917"'
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [admobAppId:'ca-app-pub-7138311889196067~8548143541']
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-7138311889196067/3263852262"'
            buildConfigField 'String', 'REWARDED_AD_UNIT', '"ca-app-pub-7138311889196067/8300731537"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
