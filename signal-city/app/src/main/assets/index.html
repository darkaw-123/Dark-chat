function gamePage(){let l=levels[current],tileSize=getComputedStyle(document.documentElement).getPropertyValue('--tile').trim();$('main').innerHTML=`<div class="page-head"><div><button class="back" id="back">← LEVELS</button><div class="eyebrow">LEVEL ${String(current+1).padStart(2,'0')} · ${e(l.place)}</div><h2>${e(l.name)}</h2><p>Connect the entrance to the destination.</p></div><span class="mini-badge">${l.shared?'COMMUNITY · NO COINS':levelDone(l,current)?'REPLAY':'+ '+l.reward+' COINS'}</span></div><div class="mission-bar"><div><span class="mission-label">LIVE ROUTE CONTROL</span><strong id="routeStatus">Connect the roads and turn signals green</strong></div><div class="mission-buttons"><button class="auto-toggle" id="autoMode" aria-pressed="${saved.auto}">${saved.auto?'AUTO DRIVE ON':'AUTO DRIVE OFF'}</button><button class="btn dispatch-main" id="dispatch">➜ &nbsp; SEND CAR</button></div></div><div class="play-layout"><section class="panel board-shell"><div class="board-bar"><strong>← START &nbsp; → &nbsp; DESTINATION</strong><span>Swipe sideways to see the whole city ↔</span></div><div class="map-scroll" aria-label="Scrollable city map"><div class="map-frame" id="frame"><div class="map-grid" id="grid">${tiles.map((t,i)=>`<button class="tile ${t.fixed?'fixed':''}" data-tile="${i}" ${t.fixed?'disabled':''} aria-label="${t.fixed?'Fixed road':'Rotate road'} row ${t.y+1} column ${t.x+1}">${sceneSVG(t)}<div class="road-rot" style="transform:rotate(${t.rot*90}deg)">${roadSVG(t.base)}</div>${t.fixed?`<span class="gate">${t.x===0?'IN →':'HOME'}</span>`:''}</button>`).join('')}</div>${signals.map((s,i)=>`<button class="signal ${s.green?'green':''}" data-light="${i}" style="left:calc(var(--tile) * ${s.x} + var(--tile) - 33px);top:calc(var(--tile) * ${s.y} + 3px)" aria-label="Signal ${i+1}: ${s.green?'green':'red'}. Tap to switch."><span></span></button>`).join('')}<div class="car car-${carChoice().style} ${assetId(carChoice().image_id)?'has-photo':''}" style="--car-colo function findPath(ignoreLights=false){const l=levels[current],start=pos(...l.route[0]),end=pos(...l.route[l.route.length-1]);let queue=[start],prev=new Map([[start,-1]]);while(queue.length){let i=queue.shift(),t=tiles[i];let signal=signals.find(s=>s.x===t.x&&s.y===t.y);if(signal&&!signal.green&&!ignoreLights)continue;if(i===end)break;let m=rotate(t.base,t.rot);for(let d=0;d<4;d++){if(!(m&bit[d]))continue;let x=t.x+dx[d],y=t.y+dy[d];if(x<0||x>=C||y<0||y>=R)continue;let j=pos(x,y),other=tiles[j];if(!(rotate(other.base,other.rot)&bit[opp[d]])||prev.has(j))continue;prev.set(j,i);queue.push(j)}}if(!prev.has(end))return null;let dest=tiles[end],endSig=signals.find(s=>s.x===dest.x&&s.y===dest.y);if(endSig&&!endSig.green&&!ignoreLights)return null;let out=[];for(let p=end;p!==-1;p=prev.get(p))out.unshift(p);return out}
function hintTarget(){let wrong=tiles.find(t=>t.onRoute&&!t.fixed&&rotate(t.base,t.rot)!==t.base);let red=signals.find(s=>!s.green);return wrong?{type:'tile',index:pos(wrong.x,wrong.y)}:red?{type:'light',index:signals.indexOf(red)}:null}
function showHint(){let target=hintTarget();if(!target){toast('The main route looks ready. Try dispatch!');return}let b=document.querySelector(target.type==='tile'?`[data-tile="${target.index}"]`:`[data-light="${target.index}"]`);if(!b)return;if(target.type==='tile')b.classList.add('hint');b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});toast(target.type==='tile'?'Try turning the highlighted road.':'Switch the red signal to green.')}
function hint(){if(!hintTarget()){toast('The main route looks ready. Try dispatch!');return}let level=current;modal(`<div class="eyebrow">A LITTLE HELP</div><h2 id="modalTitle">Need a hint?</h2><p>Choose coins or complete ${adIsNative()?'one rewarded ad':'one simulated test ad'} to reveal a useful move.</p><div class="modal-buttons"><button class="btn secondary" id="hintCoins">✦ 15 COINS</button><button class="btn gold" id="hintAd">▶ WATCH ${adIsNative()?'AD':'TEST AD'}</button></div><div class="modal-buttons"><button class="btn secondary" id="hintCancel">CANCEL</button></div>`);$('hintCancel').onclick=closeModal;$('hintCoins').onclick=()=>{if(saved.coins<15){toast('You need 15 coins.');return}saved.coins-=15;save();header();closeModal();showHint()};$('hintAd').onclick=()=>watchAd(()=>{if(page==='game'&&current===level)showHint();else toast('Return to the level to use your hint.')})}

function scheduleDispatch(){clearTimeout(autoTimer);if(page!=='game'||busy||!$('routeStatus'))return;let ready=!!findPath(false);$('routeStatus').textContent=ready?(saved.auto?'Route ready · car is starting…':'Route ready · press Send Car'):'Connect the roads and turn signals green';if(ready&&saved.auto){toast('Route ready! Your car is starting.');autoTimer=setTimeout(()=>{if(page==='game'&&!busy&&findPath(false))dispatch()},1100)}}
async function dispatch(){if(busy)return;clearTimeout(autoTimer);let path=findPath(false);if(!path){toast(findPath(true)?'A signal on the route is red. Tap it green.':'Roads are not connected yet. Turn the tiles.');return}busy=true;document.querySelectorAll('.actions button,.mission-buttons button').forEach(b=>b.disabled=true);if($('routeStatus'))$('routeStatus').textContent='Car on the way…';let car=$('car'),frame=$('frame'),px=frame.getBoundingClientRect().width/C;car.style.display='block';const move=(n,previous)=>{let t=tiles[n];if(previous!==undefined){let prev=tiles[previous],angle=Math.atan2(t.y-prev.y,t.x-prev.x)*180/Math.PI;car.style.transform='rotate('+angle+'deg)'}car.style.left=(t.x*px+px/2-17)+'px';car.style.top=(t.y*px+px/2-10)+'px'};move(path[0]);await new Promise(r=>setTimeout(r,80));for(let i=1;i<path.length;i++){move(path[i],path[i-1]);await new Promise(r=>setTimeout(r,420))}let l=levels[current],first=!l.shared&&!levelDone(l,current);if(!l.shared){missionState().wins++;if(first){if(current<officialCount){saved.completed.push(current);saved.unlocked=Math.max(saved.unlocked,Math.min(officialCount,current+2))}else{if(!Array.isArray(saved.extraCompleted))saved.extraCompleted=[];saved.extraCompleted.push(l.id)}saved.coins+=l.reward}save()}header();busy=false;document.querySelectorAll('.actions button,.mission-buttons button').forEach(b=>b.disabled=false);if($('routeStatus'))$('routeStatus').textContent='Destination reached!';beep(850);modal(`<div class="eyebrow">MISSION COMPLETE ✦</div><h2 id="modalTitle">Safe and sound!</h2><p>Your car made it home. ${l.shared?'Community route complete. No coins are awarded for playing it.':first?'You earned '+l.reward+' coins and unlocked the next available level.':'You have already collected this level’s coins.'}</p><div class="modal-buttons"><button class="btn secondary" id="levelList">LEVELS</button><button class="btn" id="nextLevel">${!l.shared&&current+1<permanentCount?'NEXT LEVEL →':'BACK TO LEVELS'}</button></div>`);$('levelList').onclick=()=>{closeModal();go('levels')};$('nextLevel').onclick=()=>{closeModal();if(!l.shared&&current+1<permanentCount&&levelUnlocked(current+1))start(current+1);else go('levels')}}
function watchAd(onEarn){if(pendingReward)return;let id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);pendingReward={id,onEarn};if(adIsNative()){modal(`<div class="eyebrow">REWARDED AD</div><h2 id="modalTitle">Getting your ad ready.</h2><p>Your reward is given only after the ad is completed. If an ad is unavailable, please try again.</p><div class="modal-buttons"><button class="btn secondary" id="cancelAd">CANCEL</button></div>`);$('cancelAd').onclick=()=>closeModal();try{window.SignalAds.showReward(id)}catch(err){pendingReward=null;closeModal();toast('Ad unavailable. Please try again.')}return}let seconds=5;modal(`<div class="eyebrow">SIMULATED TEST AD</div><h2 id="modalTitle">A little break.</h2><p>This browser preview uses a simulation, not a real advertisement. Complete the test to continue.</p><div class="test-box"><div><span>✦</span><br><strong>TEST AD PREVIEW</strong><br>Thanks for testing Signal City!</div></div><div class="modal-buttons"><button class="btn secondary" id="cancelAd">CANCEL</button><button class="btn gold" id="finishAd" disabled>WAIT ${seconds}s</button></div>`);$('cancelAd').onclick=()=>closeModal();adTimer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(adTimer);adTimer=null;$('finishAd').disabled=false;$('finishAd').textContent='COMPLETE TEST AD'}else $('finishAd').textContent='WAIT '+seconds+'s'},1000);$('finishAd').onclick=()=>window.signalRewardResult(id,'earned')}
window.signalRewardResult=(id,status)=>{if(!pendingReward||pendingReward.id!==id)return;let job=pendingReward;pendingReward=null;closeModal();if(status==='earned')job.onEarn();else toast(status==='unavailable'?'No ad available. Please try again.':'Ad closed before reward.')};
function watchUnlock(kind,id){let list=kind==='theme'?themeCatalog:carCatalog,item=list.find(x=>x.id===id);if(!item)return;let owned=kind==='theme'?saved.owned:saved.ownedCars,key=kind+':'+id;if(owned.includes(id)){toast('Already unlocked.');return}watchAd(()=>{if(owned.includes(id))return;saved.rewardProgress[key]=progress(key)+1;if(progress(key)>=2){owned.push(id);delete saved.rewardProgress[key];if(kind==='theme')saved.theme=id;else saved.car=id;save();render();toast(item.name+' unlocked!')}else{save();render();toast('One ad complete. Watch one more to unlock.')}})}
function buyItem(kind,id){let list=kind==='theme'?themeCatalog:carCatalog,item=list.find(x=>x.id===id);if(!item)return;let owned=kind==='theme'?saved.owned:saved.ownedCars;if(!owned.includes(id)){let price=priceFor(item);if(saved.coins<price)return toast('You need more coins.');saved.coins-=price;owned.push(id);delete saved.rewardProgress[kind+':'+id]}if(kind==='theme')saved.theme=id;else saved.car=id;save();render();toast(item.name+' selected!')}
function shopPage(){let items=shopTab==='themes'?themeCatalog:carCatalog,per=12,total=Math.max(1,Math.ceil(items.length/per));shopPageIndex=Math.max(1,Math.min(shopPageIndex,total));let visible=items.slice((shopPageIndex-1)*per,shopPageIndex*per);$('main').innerHTML=`<div class="page-head"><div><button class="back" id="back">← BACK HOME</button><div class="eyebrow">MAKE IT YOUR CITY</div><h2>City style studio.</h2><p>Discover ${fmt(themeCatalog.length)} city styles and choose your ride.</p></div><span class="mini-badge">✦ ${fmt(saved.coins)} COINS</span></div><div class="shop-tabs"><button class="btn ${shopTab==='themes'?'':'secondary'}" id="themesTab">CITY THEMES</button><button class="btn ${shopTab==='cars'?'':'secondary'}" id="carsTab">CARS</button></div><div class="sync-note"><span id="syncStatus">${e(syncStatus)}</span><button id="syncShop" class="btn secondary tiny">↻ REFRESH SHOP</button></div><div class="shop-grid">${visible.map(x=>{let kind=shopTab==='themes'?'theme':'car',own=(kind==='theme'?saved.owned:saved.ownedCars).includes(x.id),selected=(kind==='theme'?saved.theme:saved.car)===x.id;return `<div class="shop-card">${kind==='theme'?`${assetId(x.image_id)?`<img class="uploaded-art" alt="${e(x.name)}" data-asset="${e(x.image_id)}">`:`<div class="swatch ${x.variant==='day'?'':x.variant}" style="background:linear-gradient(140deg,${x.ground},${x.street})"><span class="preview-tower"></span><span class="preview-house"></span><span class="preview-road"></span><span class="preview-tree">${x.variant==='winter'?'❄':x.variant==='neon'?'✦':'●'}</span></div>`}`:`<div class="car-preview">${assetId(x.image_id)?`<img class="car-picture" alt="${e(x.name)}" data-asset="${e(x.image_id)}">`:`<div class="mini-car mini-${x.style}" style="--car-color:${x.color}"><span></span></div><div class="car-shadow"></div>`}</div>`}<h3>${e(x.name)}</h3><p>${e(x.desc||'A different ride for your city journeys.')}</p>${!own&&discountFor(x)>0?`<p class="sale-tag">${discountFor(x)}% OFF · <s>${x.cost}</s> ${priceFor(x)} COINS</p>`:''}${own?`<button class="btn ${selected?'secondary':''}" data-buy="${e(x.id)}" ${selected?'disabled':''}>${selected?'SELECTED':'SELECT'}</button>`:`<div class="unlock-actions"><button class="btn" data-buy="${e(x.id)}">✦ ${priceFor(x)} COINS</button><button class="btn secondary" data-ad="${e(x.id)}">▶ ${adIsNative()?'AD':'TEST AD'} ${progress(kind+':'+x.id)}/2</button></div>`}</div>`}).join('')}</div><div class="pagination"><button class="btn secondary tiny" id="prevShop" ${shopPageIndex===1?'disabled':''}>← PREVIOUS</button><span>PAGE ${shopPageIndex} OF ${total}</span><button class="btn secondary tiny" id="nextShop" ${shopPageIndex===total?'disabled':''}>NEXT →</button></div><div class="panel" style="margin-top:18px"><div class="eyebrow">BONUS CORNER</div><h3 style="margin-top:7px">A little extra help.</h3><p>${adIsNative()?'Watch a rewarded ad':'Try a simulated reward'} to add 40 game coins, or preview future premium features.</p><div class="modal-buttons"><button class="btn gold" id="reward">▶ &nbsp; ${adIsNative()?'WATCH REWARDED AD':'TRY TEST REWARD'}</button><button class="btn secondary" id="premium">✦ &nbsp; PREMIUM DETAILS</button></div></div><div class="notice">${adIsNative()?'Ad availability depends on your connection and the ad provider.':'Browser preview: ads are simulated; real AdMob ads require the Android app.'} Real-money purchases are not connected.</div>`;$('syncShop').onclick=()=>{syncStatus='Refreshing…';$('syncStatus').textContent=syncStatus;refreshCityConfig()};$('back').onclick=()=>go('home');$('themesTab').onclick=()=>{shopTab='themes';shopPageIndex=1;render()};$('carsTab').onclick=()=>{shopTab='cars';shopPageIndex=1;render()};$('prevShop').onclick=()=>{shopPageIndex--;render();window.scrollTo({top:0,behavior:'smooth'})};$('nextShop').onclick=()=>{shopPageIndex++;render();window.scrollTo({top:0,behavior:'smooth'})};$('reward').onclick=reward;$('premium').onclick=()=>{modal('<div class="eyebrow">COMING LATER</div><h2 id="modalTitle">City Pass</h2><p>Premium features are planned. Real payments are not connected in this preview, and no payment will be taken.</p><div class="modal-buttons"><button class="btn" id="close">GOT IT</button></div>');$('close').onclick=closeModal};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(shopTab==='themes'?'theme':'car',b.dataset.buy));document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>watchUnlock(shopTab==='themes'?'theme':'car',b.dataset.ad))}
function reward(){watchAd(()=>{saved.coins+=40;save();render();toast('40 game coins added!')})}

if(Array.isArray(saved.cachedAdminLevels)){adminRows=saved.cachedAdminLevels.filter(validRoute);adminReady=true}rebuildCatalog();render();save();refreshCityConfig();refreshCommunity();syncRewards().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCityConfig()});setInterval(refreshCityConfig,15000);setInterval(()=>{if(page!=='game'&&catalogWeek!==currentWeek()){rebuildCatalog();if(page==='home'||page==='levels'||page==='missions')render()}if(page==='levels')refreshCommunity()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncRewards().catch(()=>{});if(page!=='game'&&catalogWeek!==currentWeek()){rebuildCatalog();render()}if(page==='levels')refreshCommunity()}});
</script></body></html>
